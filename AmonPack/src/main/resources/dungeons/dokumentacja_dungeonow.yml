# =========================================================================
# PODRĘCZNIK SKRYPTOWANIA DUNGEONÓW - KOMPLETNY PRZEWODNIK (AMONPACK LOCHY V2)
# =========================================================================
# Ten plik stanowi oficjalny poradnik i kompletną dokumentację techniczną
# dla systemu dynamicznych lochów rogue-lite wtyczki AmonPack.
# Wszystkie sekcje, właściwości, efekty i warunki zostały opisane poniżej
# wraz z dokładnymi parametrami oraz przejrzystymi przykładami.
#
# =========================================================================
# CZĘŚĆ I: STRUKTURA GŁÓWNA SZABLONU LOCHU
# =========================================================================
# Każdy szablon lochu musi posiadać poprawny format nagłówka konfigurującego
# parametry bazowe, rejestr przedmiotów, skrzynię ulepszeń oraz nagrody.

name: "Komnata Cieni"                    # Unikalna, wyświetlana nazwa lochu (obsługuje kolory &)
schematic: "komnata_cieni.schem"         # Nazwa pliku WorldEdit .schem/.schematic znajdującego się w folderze wtyczki
paste-location:
  x: 0                                   # Koordynaty wklejenia schematu w nowo utworzonym świecie
  y: 60
  z: 0
spawn-location:
  x: 0                                   # Początkowy punkt startowy (teleport graczy po wejściu)
  y: 61
  z: 0
exit-location:
  world: "world"                         # Świat docelowy po zakończeniu lub opuszczeniu lochu
  x: 100
  y: 64
  z: 100
initial-encounter: "ENC1"                # Pierwszy, startowy etap lochu od którego rozpoczyna się gra

# =========================================================================
# CZĘŚĆ II: REJESTR PRZEDMIOTÓW NIESTANDARDOWYCH (items)
# =========================================================================
# Sekcja umożliwiająca tworzenie unikalnych kluczy cieni i rzucanych pocisków.
# Przedmioty te są automatycznie rejestrowane i mogą być używane w warunkach.
#
# Właściwości przedmiotu:
#   - material: Materiał bazowy przedmiotu ze Spigota (String)
#   - nazwa/name: Nazwa wyświetlana przedmiotu w eq (obsługuje kolory &)
#   - opis/lore: Kilkulinijkowy opis lore przedmiotu (Lista String)
#   - typ/type: Typ zachowania: 'key' (klucz), 'throwable' (pocisk rzucany PPM)
#   - custom-model-id: (Opcjonalne) CustomModelData dla ItemsAdder/ResourcePack (Integer)

# Przedmioty Jednorazowego Użytku (consumables)
#    W sekcji `items` szablonu lochu można zarejestrować materiały eksploatacyjne (consumables).
#    Parametry konfiguracji przedmiotu:
#    - typ/type: "consumable" lub "consumables"
#    - use-mode / tryb-uzycia:
#        * PPM: Szybkie, natychmiastowe użycie prawym przyciskiem myszy.
#        * SNEAK / SHIFT: Rytualne ładowanie kucaniem przez 2.5 sekundy.
#    - effect / efekt:
#        * heal: Uleczenie o zdefiniowaną wartość HP (np. 4.0 HP = 2 serca).
#        * speed: Zwiększa statystykę prędkości lochowej (speedBoost) o [wartość] na [czas-trwania] sekund (bezpiecznie przywraca po czasie bez potion effect).
#        * jumpboost: Daje potkę Jump Boost o poziomie [wartość] na [czas-trwania] sekund.
#        * damage_boost: Zwiększa statystykę mnożnika obrażeń (dmgMultiplier) o [wartość] (np. 0.2 = +20%) na [czas-trwania] sekund.
#        * hp_boost: Zwiększa statystykę maksymalnego zdrowia lochowego (hpBoost) o [wartość] (np. 4.0 = +2 serca) na [czas-trwania] sekund z uleczeniem.
#        * crit_rate_boost: Zwiększa czasowo szansę na Fizyczny i Magiczny Krytyk o [wartość] (np. 0.15 = 15%) na [czas-trwania] sekund.
#    - duration / czas-trwania: Czas trwania efektu w sekundach.
#    - value / wartosc: Wartość liczbowa (moc/poziom) efektu.
#
# Przykład przedmiotu jednorazowego:
# items:
#   mikstura_sily:
#     material: "POTION"
#     nazwa: "&c&lEliksir Gniewu"
#     opis:
#       - "&7Przytrzymaj SHIFT (kucanie), aby wypić."
#       - "&7Zwiększa siłę na 10 sekund."
#     typ: "consumable"
#     tryb-uzycia: "SNEAK"
#     efekt: "damage_boost"
#     czas-trwania: 10
#     wartosc: 2
#     custom-model-id: 2005



items:
  cien_klucz:
    material: "TRIPWIRE_HOOK"
    nazwa: "&6Klucz Bramy Cieni"
    opis:
      - "&7Służy do otwarcia starożytnych wrót."
    typ: "key"
    custom-model-id: 1001
  cien_kamien:
    material: "FIRE_CHARGE"
    nazwa: "&cOgnisty Pocisk"
    opis:
      - "&7Rzuć nim PPM, aby trafić w punkt lub w shielded bossa!"
    typ: "throwable"
    custom-model-id: 1002

# =========================================================================
# CZĘŚĆ III: SKRZYNIA ULEPSZEŃ (loot-chest)
# =========================================================================
# Definiuje dozwolone statystyki i ulepszenia rogue-lite (błogosławieństwa)
# wypadające ze skrzyni w trakcie rozgrywki lochu.
#
# Statystyki bazowe (allowed-stats):
#   - HP: Zwiększa maksymalne zdrowie (+4 HP / +2 Serca).
#   - DEF: Zwiększa obronę (+10 DEF), zmniejszając procentowo obrażenia.
#   - DMG: Zwiększa zadawane obrażenia fizyczne i magiczne o 15% (+0.15).
#   - SPEED: Zwiększa prędkość poruszania się (+10% / +0.02).
#   - P_CRIT_RATE: Szansa na Fizyczny Kryt bronią lub pięścią (+10% szansy). Bazowa: 5%.
#   - P_CRIT_DMG: Mnożnik obrażeń Fizycznego Kryta (+20% mocy). Bazowa: +50% (x1.5).
#   - M_CRIT_RATE: Szansa na Magiczny Kryt umiejętnościami/czarami (+10% szansy). Bazowa: 5%.
#   - M_CRIT_DMG: Mnożnik obrażeń Magicznego Kryta (+20% mocy). Bazowa: +50% (x1.5).
#   - REGEN: Regeneracja lochowa. Naturalna regeneracja w lochach jest wyłączona.
#            Każdy poziom REGEN leczy gracza o 10% maksymalnego HP co 10 sekund.
#
# Błogosławieństwa (allowed-blessings):
#   Każde wylosowanie już odblokowanego błogosławieństwa podnosi jego poziom (Tier).
#   Wszystkie błogosławieństwa mają bazową szansę aktywacji równą 5% * Poziom.
#   - VAMPIRISM: Szansa (5% * lvl) przy zabiciu płonącego przeciwnika na uleczenie o 4 HP (2 serca).
#   - DODGE: Szansa (5% * lvl) na całkowity unik i anulowanie otrzymywanych obrażeń.
#   - ADRENALINE: Szansa (5% * lvl) przy zadawaniu obrażeń mając poniżej 20% HP na zwiększenie ich o 50% (+0.50).
#   - LIFESTEAL: Trafienia mają szansę (5% * lvl) uleczyć gracza o 20% zadanych obrażeń.
#   - HEAL: Otrzymane leczenie ma szansę (5% * lvl) zostać wzmocnione o 50% (+0.50).
#   - KNOCKBACK: Ataki mają szansę (5% * lvl) mocno odrzucić wroga w tył.
#   - COUNTER: Szansa (5% * lvl) na zignorowanie obrażeń i natychmiastowe odbicie ich w atakującego.
#   - FLAMING: Ataki mają szansę (5% * lvl) podpalić wroga na 4 sekundy za każdy poziom (4s * lvl).
#   - POISON: Fizyczne ataki mają szansę (5% * lvl) otruć wroga na 4 sekundy.
#   - COMBUSTION: Ataki w podpalonych wrogów mają szansę (5% * lvl) zadać zwiększone o 25% obrażenia.
#
# Inne mechaniki walki lochów:
#   * Blokada ognia: Moby płonące w lochach nie podpalają graczy przy ataku (vanilla combust zablokowany).
#   * Kompas gotowości / rozpoczęcie etapu: Daje wszystkim graczom pełne uleczenie i nasycenie głodu.
#
# Przykład konfiguracji w pliku lochu:
# loot-chest:
#   allowed-stats:
#     - HP
#     - DEF
#     - DMG
#     - SPEED
#     - P_CRIT_RATE
#     - P_CRIT_DMG
#     - M_CRIT_RATE
#     - M_CRIT_DMG
#     - REGEN
#   allowed-blessings:
#     - VAMPIRISM
#     - DODGE
#     - ADRENALINE
#     - LIFESTEAL
#     - HEAL
#     - KNOCKBACK
#     - COUNTER
#     - FLAMING
#     - POISON
#     - COMBUSTION

# =========================================================================
# CZĘŚĆ IV: NAGRODY KOŃCOWE (rewards)
# =========================================================================
# Nagrody przyznawane wszystkim graczom po pomyślnym ukończeniu lochu.
#
# Właściwości:
#   - dungeon-xp: Doświadczenie poziomu lochu (Integer)
#   - money: Waluta w grze (Double)
#   - commands: Lista komend wykonywanych przez konsolę (%player% zastępuje gracza)
#   - items: Dowolna liczba niestandardowych przedmiotów do wręczenia

rewards:
  dungeon-xp: 250
  money: 500
  commands:
    - "give %player% gold_ingot 5"
  items:
    nagroda_miecz:
      material: "DIAMOND_SWORD"
      amount: 1
      display-name: "&cMiecz Cienia"
      lore:
        - "&7Potężne ostrze wyjęte z ruin."

# =========================================================================
# CZĘŚĆ V: KOMPLETNY KATALOG WARUNKÓW (Conditions)
# =========================================================================
# Warunki (conditions) określają wymagania do ukończenia danego etapu (Encounter).
# Mogą zawierać sekcję 'oncomplete' - listę efektów wyzwalanych przy ukończeniu
# tego konkretnego warunku.
#
# SYSTEM LOSOWANIA WSPÓŁRZĘDNYCH (xList, yList, zList):
# Każdy warunek lub efekt używający współrzędnych XYZ może przyjąć listę koordynatów w formacie YAML,
# np.:
#   x: [10.0, 20.0, 30.0]
#   y: [61.0, 62.0, 63.0]
#   z: [-5.0, -10.0, -15.0]
# Wtyczka wylosuje pojedynczy indeks z list współrzędnych dla danego uruchomienia instancji lochu
# (np. x[1], y[1], z[1]) i zachowa go jako stały na całą sesję instancji, co umożliwia unikalny układ lochu przy każdym wejściu!
#
# 1. ALL_PLAYERS_READY
#    Sprawdza, czy wszyscy gracze kliknęli gotowość przy użyciu Kompasu Gotowości.
#    Przykład:
#      - type: "ALL_PLAYERS_READY"
#
# 2. PLAYER_ENTER_AREA
#    Zwraca prawda, jeśli chociaż jeden gracz wejdzie w obszar o promieniu R od punktu XYZ.
#    Parametry: x, y, z (Double), radius (Double), required_all_players (Opcjonalne, domyślnie false. Jeśli true, wymaga aby wszyscy gracze byli w polu, Boolean)
#    Przykład:
#      - type: "PLAYER_ENTER_AREA"
#        x: 10.0
#        y: 61.0
#        z: -5.0
#        radius: 2.5
#        required_all_players: true
#
# 3. KILL_MOBS
#    Zaliczane gdy gracze pokonają wymaganą liczbę potworów o danej nazwie.
#    Śmierć moba jest rejestrowana z DOWOLNEGO źródła (podpalenie, upadek, gracze).
#    Parametry: mob-name (String) minecraftowy typ moba np ZOMBIE lub displayname "&7Duch" trzeba jako "Duch", amount (Integer)
#    Przykład:
#      - type: "KILL_MOBS"
#        mob-name: "ZOMBIE"
#        amount: 5
#
# 4. INTERACT_BLOCK_WITH_ITEM
#    Zaliczane przy kliknięciu PPM na określony blok za pomocą przedmiotu z rejestru.
#    Parametry: x, y, z (Double), radius (Opcjonalny promień w blokach od centrum, Double), block-material (Material), item-material (ID przedmiotu z rejestru lub materiał Spigot), required_items (Opcjonalne, domyślnie true. Jeśli false, warunek zaliczy się przy samym kliknięciu, bez potrzeby posiadania/trzymania przedmiotu, Boolean)
#    Przykład:
#      - type: "INTERACT_BLOCK_WITH_ITEM"
#        x: 5.0
#        y: 62.0
#        z: 10.0
#        radius: 3.5
#        block-material: "IRON_DOOR"
#        item-material: "cien_klucz"
#        required_items: false
#
# 5. ZONE
#    Przejęcie wyznaczonej strefy (okręgu na ziemi) poprzez stanie w niej łącznie przez X sekund.
#    Wychodzenie ze strefy cofa postęp o 1 sekundę na sekundę nieobecności. Rysuje cząsteczki GLOW wokół strefy.
#    Parametry: x, y, z (Double), radius (Double), time (Sekundy, Integer)
#    Przykład:
#      - type: "ZONE"
#        x: 15.0
#        y: 61.0
#        z: 15.0
#        radius: 3.0
#        time: 20
#
# 6. THROW_AT
#    Trafienie rzucanym pociskiem (typu PPM 'throwable') w określone współrzędne X razy.
#    Pociski mają grawitację, parabolę lotu oraz efektowne particle.
#    Parametry: x, y, z (Double), radius (Double), item (ID pocisku), amount (Integer), is-returning (Boolean, opcjonalne, domyślnie false)
#    * is-returning: true -> jeśli gracz rzuci i spudłuje (nie trafi w cel), przedmiot wraca bezpośrednio do jego EQ!
#    Przykład:
#      - type: "THROW_AT"
#        x: 20.0
#        y: 65.0
#        z: 0.0
#        radius: 1.5
#        item: "cien_kamien"
#        amount: 3
#        is-returning: true
#
# 7. SHIELDED
#    Mechanika przeciwnika z tarczą (odpornego na zwykły DMG). Aby ukończyć warunek, tarcza
#    musi zostać zniszczona, a sam boss ostatecznie zabity.
#    Parametry:
#      - mob-name (String: kodowa nazwa MythicMobsa / Minecrafta służąca do jego przyzwania)
#      - mob-display-name (Opcjonalne, String: wyświetlana nazwa displayname bossa w grze. Jeśli podana, wtyczka
#        będzie wyszukiwać i weryfikować bossa po jego nazwie wyświetlanej, a nie kodowej. Przydatne dla MythicMobs!)
#      - item (String: ID przedmiotu z rejestru, którym trzeba rzucać w trybie 'throw')
#      - amount (Integer: wymagana ilość trafień pociskiem aby rozbić tarczę w trybie 'throw')
#      - shield-type (String: typ tarczy, "throw" lub "event_removable")
#        * "throw" - tarcza zdejmuje się po X celnych rzutach przedmiotem
#        * "event_removable" - tarcza zdejmuje się wyłącznie poprzez efekt SHIELD_REMOVE
#      - x, y, z (Double lub List: współrzędne spawnu bossa)
#    Przykład:
#      - type: "SHIELDED"
#        mob-name: "ShadowGhost"
#        mob-display-name: "Cień Bossa"
#        item: "ksiega"
#        amount: 4
#        shield-type: "throw"
#        x: [-2.0, -4.0]
#        y: [131.0, 131.0]
#        z: [-11.0, -13.0]
#
# 8. DROP_ON_DEATH
#    Szansa na otrzymanie określonego przedmiotu bezpośrednio do ekwipunku po śmierci moba o danej nazwie.
#    Parametry: mob-name (String), item (ID przedmiotu z rejestru), chance (Double 0.0-100.0)
#    Przykład:
#      - type: "DROP_ON_DEATH"
#        mob-name: "ZOMBIE"
#        item: "cien_kamien"
#        chance: 50.0
#
# 9. PERIODIC_CHECK
#    Cyklicznie co X sekund sprawdza wyznaczony stan graczy. Niezaliczenie uruchamia kary/efekty fail-effects,
#    zaliczenie wyzwala success-effects.
#    Parametry:
#      - interval: interwał czasu w sekundach (Integer)
#      - requirement: Wymóg do sprawdzenia (String):
#          * SNEAKING (wszyscy gracze kucają)
#          * IN_AIR (wszyscy gracze w powietrzu)
#          * SPRINTING (wszyscy gracze biegną)
#          * MOVING (wszyscy gracze w ruchu w ostatniej sekundzie)
#          * NEAR_EACH_OTHER (wszyscy gracze w odległości max 6.0 bloków od siebie)
#          * AWAY_FROM_EACH_OTHER,<dystans> (gracze oddaleni o min. podany dystans, np. AWAY_FROM_EACH_OTHER,10.0)
#          * HAVE_ITEMS:<id>,<ilość>;<id2>,<ilość> (sprawdza czy PRZYNAJMNIEJ JEDEN gracz posiada podane przedmioty, np. HAVE_ITEMS:cien_klucz,1)
#          * ALL_HAVE_ITEMS:<id>,<ilość>;<id2>,<ilość> (sprawdza czy WSZYSCY gracze posiadają podane przedmioty, np. ALL_HAVE_ITEMS:cien_klucz,1)
#      - once: (Opcjonalne, Boolean) Jeśli ustawione na true, pierwszy pomyślny sukces na stałe wyłącza sprawdzanie w trwającym etapie.
#      - fail-effects: Lista efektów wykonywanych przy porażce sprawdzania.
#      - success-effects: Lista efektów wykonywanych przy sukcesie sprawdzania.
#    Wykorzystanie zmiennej: W tytule etapu lochu można użyć tagu %time% pokazującego odliczanie pozostałych sekund.
#    Przykład:
#      - type: "PERIODIC_CHECK"
#        interval: 30
#        requirement: "ALL_HAVE_ITEMS:cien_klucz,1"
#        once: true
#        fail-effects:
#          - type: "DAMAGE"
#            amount: 4
#          - type: "SEND_MESSAGE"
#            message: "&cNikt z was nie posiada klucza! Otrzymujecie obrażenia krytyczne."
#        success-effects:
#          - type: "SEND_MESSAGE"
#            message: "&aZadanie zaliczone! Wszyscy gracze posiadają wymagany klucz cieni."
#
# 10. LOOKING_AT
#     Sensor kierunku spojrzenia. Sprawdza, czy chociaż jeden z graczy patrzy bezpośrednio na cel XYZ.
#     Zmiana stanu z patrzenia na nie-patrzenie wyzwala odpowiednie pakiety efektów.
#     Dodatkowo, jeśli nikt się nie patrzy, co 'interval' sekund wyzwalają się fail-effects.
#     Parametry: 
#       - x, y, z (Double - punkt obserwacji)
#       - radius (Double - opcjonalny dystans od bloku, w którym gracz musi się znajdować, aby spojrzenie zostało zaliczone)
#       - interval (Sekundy powtórzeń kar, Integer)
#     Przykład:
#       - type: "LOOKING_AT"
#         x: 0.0
#         y: 65.0
#         z: 5.0
#         radius: 10.0
#         interval: 5
#         fail-effects:
#           - type: "SPAWN_MOB"
#             mob-name: "SKELETON"
#             amount: 1
#             x: 0.0
#             y: 61.0
#             z: 5.0
#         success-effects:
#           - type: "SEND_MESSAGE"
#             message: "&dKryształ cieni został uwięziony twoim wzrokiem. Szkielety przestały się rodzić!"
#
# 11. ALIVE
#     Bieżący sensor obecności potworów. Zwraca true jeśli określony potwór o danej nazwie żyje w promieniu R od XYZ.
#     Zmiana stanu obecności potwora wyzwala natychmiast success-effects lub fail-effects.
#     Parametry: x, y, z (Double), radius (Double), mob-name (String), amount (Wymagana liczba potworów, Integer)
#     Przykład:
#       - type: "ALIVE"
#         x: 10.0
#         y: 61.0
#         z: 10.0
#         radius: 20.0
#         mob-name: "Boss_Cienia"
#         amount: 1
#         fail-effects:
#           - type: "OPEN_DOOR"
#             x1: 10.0
#             y1: 60.0
#             z1: -1.0
#             x2: 12.0
#             y2: 63.0
#             z2: -1.0
#             material: "AIR"
#           - type: "SEND_MESSAGE"
#             message: "&aBoss poległ! Skalne drzwi do skarbca zostały otwarte!"
#
# 12. COLLECT_POINTS
#     Czasowy warunek zbierania koordynatów. Cząsteczki są ZAWSZE idealnie wyśrodkowane na wskazanym bloku.
#     Tworzą one pionowy, wznoszący się w niebo efekt BEACONA (kolumnę światła i błysków) oraz świecący okrąg
#     na podłożu wyznaczający strefę zebrania. Zmusza graczy do wejścia w zasięg wszystkich punktów przed upływem
#     limitu czasu. Odliczanie rozpoczyna się od pierwszego zebranego punktu.
#     W przypadku przekroczenia czasu, cały postęp się zeruje, a wtyczka wyzwala fail-effects, wymagając ponownej próby.
#     Zaliczenie wszystkich punktów wyzwala success-effects oraz pozwala ukończyć warunek.
#     Parametry: 
#       - radius (Double - odległość gracza od centrum bloku, by go zebrać, np. 3.0)
#       - time (Sekundy na ukończenie próby, Integer, np. 60)
#       - points (Lista Stringów 'x,y,z' lub lista map z kluczami x, y, z)
#       - fail-effects (Efekty przy porażce czasowej)
#       - success-effects (Efekty przy pełnym zebraniu wszystkich punktów)
#     Przykład:
#       - type: "COLLECT_POINTS"
#         radius: 3.0
#         time: 45
#         points:
#           - "15.0,61.0,-10.0"
#           - "25.0,63.0,-8.0"
#           - "10.0,62.0,-15.0"
#         fail-effects:
#           - type: "DAMAGE"
#             amount: 4
#           - type: "SEND_MESSAGE"
#             message: "&cSpóźniliście się! Czas minął, punkty zostały zresetowane!"
#         success-effects:
#           - type: "SEND_MESSAGE"
#             message: "&aDoskonale! Wszystkie punkty cieni zostały zebrane na czas!"

# =========================================================================
# CZĘŚĆ VI: KOMPLETNY KATALOG EFEKTÓW (Effects)
# =========================================================================
# Efekty (effects) są akcjami uruchamianymi przy starcie etapu, na ukończenie
# pojedynczego warunku (oncomplete), bądź okresowo przez sensory.
#
# 1. SEND_MESSAGE
#    Wysyła wiadomość czatu do wszystkich graczy w lochu.
#    Parametry: message (String, obsługuje kolory &)
#    Przykład:
#      - type: "SEND_MESSAGE"
#        message: "&eBrama cieni została otwarta!"
#
# 2. TELEPORT_PLAYERS
#    Teleportuje wszystkich graczy w lochu do wskazanego punktu XYZ.
#    Parametry: x, y, z (Double)
#    Przykład:
#      - type: "TELEPORT_PLAYERS"
#        x: 0.0
#        y: 61.0
#        z: -10.0
#
# 3. SPAWN_MOB
#    Spawnuje wybranego potwora MythicMobs wokół punktu z losowym rozrzutem.
#    Parametry: mob-name (String) lub typ moba np. ZOMBIE, SKELETON, amount (Integer), level (Integer), x, y, z (Double), range (Rozrzut, Double)
#    Przykład:
#      - type: "SPAWN_MOB"
#        mob-name: "Spirit_Earth_1"
#        amount: 3
#        level: 1
#        x: 15.0
#        y: 61.0
#        z: 0.0
#        range: 3.5
#
# 4. OPEN_DOOR
#    Otwiera przejście zamieniając bloki w prostopadłościanie x1/y1/z1 -> x2/y2/z2 na AIR.
#    Parametry: x1, y1, z1, x2, y2, z2 (Double)
#    Przykład:
#      - type: "OPEN_DOOR"
#        x1: 5.0
#        y1: 60.0
#        z1: -1.0
#        x2: 8.0
#        y2: 63.0
#        z2: -1.0
#
# 5. CLOSE_DOOR
#    Buduje lub barykaduje przejście określonym blokiem w wyznaczonym prostopadłościanie.
#    Parametry: x1, y1, z1, x2, y2, z2 (Double), material (Material, np. IRON_BARS)
#    Przykład:
#      - type: "CLOSE_DOOR"
#        x1: 5.0
#        y1: 60.0
#        z1: -1.0
#        x2: 8.0
#        y2: 63.0
#        z2: -1.0
#        material: "IRON_BARS"
#
# 6. GIVE_READY_COMPASS
#    Usuwa stare i rozdaje wszystkim graczom Kompas Gotowości oraz Skrzynię Menu Umiejętności.
#    Przykład:
#      - type: "GIVE_READY_COMPASS"
#
# 7. SPAWN_CHEST
#    Tworzy interaktywną skrzynię nagród rogue-lite na danych kordach.
#    Parametry: x, y, z (Double), chest-type (domyślnie 'ROGUELITE_CHEST')
#    Przykład:
#      - type: "SPAWN_CHEST"
#        x: 0.0
#        y: 61.0
#        z: 5.0
#        chest-type: "ROGUELITE_CHEST"
#
# 8. COMPLETE_DUNGEON
#    Wysyła status sukcesu, rozdaje nagrody ze struktury 'rewards' i zamyka świat.
#    Przykład:
#      - type: "COMPLETE_DUNGEON"
#
# 9. SPAWN_UNTIL
#    Cykliczne spawnowanie potworów co X sekund, dopóki etap lochu nie zostanie ukończony.
#    Parametry: mob-name (String), amount (Integer), level (Integer), x, y, z (Double), range (Double), interval (Sekundy, Integer)
#    Przykład:
#      - type: "SPAWN_UNTIL"
#        mob-name: "ZOMBIE"
#        amount: 2
#        level: 1
#        x: 0.0
#        y: 61.0
#        z: 10.0
#        range: 3.0
#        interval: 10
#
# 10. KNOCKBACK
#     Gwałtownie odrzuca wszystkich aktywnych graczy wektorem prędkości XYZ.
#     Parametry: x, y, z (Double)
#     Przykład:
#       - type: "KNOCKBACK"
#         x: 0.0
#         y: 0.6
#         z: -0.8
#
# 11. PULL
#     Przyciąga graczy w stronę koordynatów XYZ z siłą określoną w amount.
#     Parametry: x, y, z (Double), amount (Mnożnik siły, Integer/Double)
#     Przykład:
#       - type: "PULL"
#         x: 10.0
#         y: 65.0
#         z: 10.0
#         amount: 2
#
# 12. DAMAGE
#     Zadaje określoną liczbę punktów bezpośrednich obrażeń wszystkim graczom w instancji.
#     Parametry: amount (Ilość obrażeń, 2 = 1 serce, Integer)
#     Przykład:
#       - type: "DAMAGE"
#         amount: 4
#
# 13. FORCE_FAIL
#     Filmowe, dramatyczne uśmiercenie całej drużyny. Przez 10 sekund co sekundę zabiera
#     10% maksymalnego zdrowia każdemu graczowi, nakładając narastające particle DUST (czerwone)
#     i LARGE_SMOKE oraz potężne negatywne efekty (Spowolnienie, Ślepota, Nudności), gwarantując
#     przegraną lochu i oczyszczenie instancji.
#     Przykład:
#       - type: "FORCE_FAIL"
#
# 14. GIVE_ITEM
#     Daje wszystkim aktywnym graczom przedmiot z rejestru 'items' lub standardowy materiał Spigota.
#     Zasada bezpiecznego wręczania: wrzuca przedmiot bezpośrednio do głównej ręki (jeśli jest pusta),
#     w przeciwnym razie dodaje go do pierwszego wolnego slotu ekwipunku, zapobiegając usunięciu trzymanego itemu.
#     Parametry: item (ID przedmiotu z rejestru lub materiału Spigot, String), amount (Ilość, Integer, domyślnie 1)
#     Przykład:
#       - type: "GIVE_ITEM"
#         item: "cien_klucz"
#         amount: 1
#
# 15. SHIELD_REMOVE
#     Usuwa tarcze ze wszystkich osłoniętych bossów w określonej lokalizacji i promieniu, wyzwalając efekty sukcesu.
#     Parametry: x, y, z (Double lub List: współrzędne środka pola działania), radius/range (Promień działania, Double)
#     Przykład:
#       - type: "SHIELD_REMOVE"
#         x: 0.0
#         y: 61.0
#         z: 5.0
#         radius: 5.0

# =========================================================================
# CZĘŚĆ VII: SYSTEM DYNAMICZNYCH PLATFORM (platforms)
# =========================================================================
# Bloki tworzące mosty, zapadnie, przejścia lub labirynty, reagujące w czasie
# rzeczywistym na określone stany lochu.
# Rejestracja może odbywać się na dwa sposoby:
#   1. Globalnie: Zdefiniowana w głównym korzeniu szablonu lochu (obok 'items' lub 'rewards').
#      Platformy te działają zawsze i są sprawdzane/aktualizowane przez całą rozgrywkę lochu.
#   2. Lokalnie: Zdefiniowana wewnątrz konkretnego etapu pod kluczem 'platforms'.
#      Platformy te działają i są aktualizowane wyłącznie wtedy, gdy ten konkretny etap jest aktywny.
# Powstanie/znikanie platformy generuje cząsteczki CLOUD oraz GLOW.
#
# Właściwości:
#   - x1, y1, z1, x2, y2, z2: Wymiary prostopadłościanu platformy (Double/Integer)
#   - material: Blok z jakiego ma powstać platforma (np. GLASS, OAK_PLANKS)
#   - inverted: Jeśli false - bloki są gdy warunek jest spełniony, znikają gdy nie.
#               Jeśli true - bloki znikają gdy warunek jest spełniony, są gdy nie.
#   - test-mode: GLOBAL (sprawdza gracza w całej instancji) lub NEAR (w promieniu 1.5 bloku od platformy)
#   - requirement: Wybrany warunek fizyczny:
#       * SNEAKING (gracz kuca)
#       * ITEM:<id_przedmiotu> (gracz posiada w dłoni/eq podany przedmiot, np. ITEM:cien_klucz)
#       * MOB_NEAR:<nazwa_moba> (potwór o danej nazwie znajduje się w odległości max 5 bloków od środka platformy)
#   - delay: (Opcjonalne, Integer) Opóźnienie aktywacji/dezaktywacji stanu platformy w sekundach (np. zapadająca się podłoga po 3 sekundach).
#   - check-interval: (Opcjonalne, Integer) Interwał sprawdzania warunku platformy w sekundach. Warunek nie jest sprawdzany co sekundę, lecz
#                     wyłącznie co X sekund (np. naprawa podłoża po 5 sekundach, jeśli nie ma nikogo w pobliżu).
#
# Przykład kompletnego użycia platformy:
#   platforms:
#     - x1: 5
#       y1: 60
#       z1: 1
#       x2: 7
#       y2: 60
#       z2: 5
#       material: "GLASS"
#       inverted: false
#       test-mode: "NEAR"
#       requirement: "ITEM:cien_klucz"
#       delay: 3
#       check-interval: 5

# =========================================================================
# CZĘŚĆ VIII: POOLE, PULSE I PĘTLE PROGRESJI
# =========================================================================
# Wtyczka obsługuje nieliniowe przechodzenie pokoi oraz pakiety sekwencyjne.
#
# 1. Losowość typu POOL (next: random):
#    Etap wejściowy deklaruje przejście na 'next: random', pulę dozwolonych pokoi 'pool',
#    liczbę wymaganych pokoi do przejścia 'req_clears' oraz etap wyjściowy 'enc_after_clears'.
#    Pokoje wewnątrz pool NIE potrzebują zadeklarowanego pola 'next'. Zostaną automatycznie
#    odegrane w losowej kolejności bez powtórzeń.
#
# 2. Pakiet sekwencyjny POOL_LISTS (next: random):
#    Zamiast pojedynczych pokoi, można zadeklarować gotowe, spięte łańcuchy etapów.
#    Plugin wybierze losowo JEDNĄ kompletną listę, w której żaden z etapów nie jest jeszcze zużyty,
#    odegra ją po kolei i przejdzie do 'enc_after_clears'.
#
# Przykład losowości POOL_LISTS:
#   ENC_START:
#     description: "Wybór losowej drogi"
#     conditions:
#       - type: "ALL_PLAYERS_READY"
#     next: "random"
#     pool_lists:
#       - ["ENC_WOJ_1", "ENC_WOJ_2"]
#       - ["ENC_LOW_1", "ENC_LOW_2"]
#     enc_after_clears: "ENC_BOSS"
#
# 3. Ograniczenie liczby potworów w etapie (max_mobs):
#    Opcjonalny parametr 'max_mobs' (Integer) zadeklarowany na poziomie etapu (Encounter).
#    Jeśli w dungeonie znajduje się więcej lub tyle samo żywych potworów, efekty typu SPAWN_MOB
#    oraz SPAWN_UNTIL nie zrodzą dodatkowych wrogów, chroniąc serwer przed lagami.
#    Przykład:
#      ENC_ARENA:
#        description: "Arena Walki"
#        max_mobs: 15
#        conditions:
#          - type: "KILL_MOBS"
#            mob-name: "ZOMBIE"
#            amount: 10
#        effects:
#          - type: "SPAWN_UNTIL"
#            mob-name: "ZOMBIE"
#            amount: 2
#            interval: 3
#
# 4. Automatyczne czyszczenie potworów po zakończeniu etapu (leave_mobs):
#    Domyślnie każdy etap (Encounter), po pomyślnym ukończeniu wszystkich warunków, 
#    automatycznie ZABIJA wszystkie potwory, które sam przyzwał (SPAWN_MOB, SPAWN_UNTIL, boss itp.), 
#    ZANIM aktywuje się kolejny etap. Gwarantuje to porządek i brak zapychania instancji.
#    Opcjonalny parametr 'leave_mobs' (Boolean - true/false, domyślnie false) pozwala wyłączyć
#    to zachowanie, jeśli chcesz, aby moby z danego pokoju pozostały żywe w kolejnym etapie.
#    Przykład:
#      ENC_TRANSITION:
#        description: "Przejściowy korytarz"
#        leave_mobs: true
#
# 5. Nawigacja i Ścieżka do Celu Etapu (guide-x, guide-y, guide-z, guide-radius):
#    Każdy etap (Encounter) może posiadać opcjonalne koordynaty celu: guide-x, guide-y, guide-z oraz guide-radius.
#    Działa to tak: jeśli gracz znajduje się w odległości równej lub większej niż 'guide-radius' od wskazanego punktu,
#    na ziemi bezpośrednio przed graczem pojawia się dynamiczny ślad świecących cząsteczek, które prowadzą go prosto
#    do wskazanego celu. Gdy gracz wejdzie w wyznaczony radius, cząsteczki nawigacyjne przestają się wyświetlać.
#    Obsługiwane formaty w konfiguracji etapu:
#      * guide-x: 100, guide-y: 64, guide-z: 200, guide-radius: 5
#      * target-x: 100, target-y: 64, target-z: 200, target-radius: 5
#      * x: 100, y: 64, z: 200, radius: 5
#      * guide: { x: 100, y: 64, z: 200, radius: 5 }
#    Przykład:
#      ENC_GATE:
#        title: "&6Udaj się do Bramy Cieni"
#        guide-x: 87.0
#        guide-y: 51.0
#        guide-z: -34.0
#        guide-radius: 4.0
#        conditions:
#          - type: "INTERACT_BLOCK_WITH_ITEM"
#            x: 87
#            y: 51
#            z: -34
#            block-material: "IRON_CHAIN"
#
# ENC1:
#   description: "Start lochu - Przygotowanie"
#   conditions:
#     - type: "ALL_PLAYERS_READY"
#   effects:
#     - type: "GIVE_READY_COMPASS"
#   next: "random"
# pool:
#   - "ENC2_1"
#   - "ENC2_2"
#   - "ENC2_3"
#   - "ENC2_4"
# req_clears: 2
# enc_after_clears: "ENC_BOSS"

# =========================================================================
# CZĘŚĆ IX: SYSTEM LEGENDRANYCH BRONI (Błogosławieństwa Broni)
# =========================================================================
# System unikalnych, ulepszalnych broni (błogosławieństw) otrzymywanych 
# tymczasowo ze skrzyń w dungeonie. Każda broń posiada stałe obrażenia bazowe 
# zdefiniowane w configu oraz system unikalnych ulepszeń na trzech poziomach (Tier).
# Wszystkie w dungeonie używane bronie zadają stałe, niezmienne obrażenia zdefiniowane poniżej.
#
# 1. ŁUK Z POUHAI (POUHAI_BOW)
#    - Materiał bazowy: BOW (Łuk)
#    - Obrażenia bazowe: 3.0 HP (konfigurowalne)
#    - Naciąganie łuku zwiększa obrażenia o +25% za każdą sekundę (do maks. +100% / 200% obrażeń bazowych).
#    - Co trzeci strzał gracza automatycznie przebija cele (setPierceLevel(10)) oraz ignoruje obronę wrogów (DEF).
#    - Poziom 1: Bazowe naciąganie i przebijanie co 3 strzały. Obrażenia bazowe 3.0 HP.
#    - Poziom 2: Trzeci strzał dodatkowo przyciąga wrogów w promieniu 6 bloków do celu z efektowną chmurą cząsteczek portalowych i chmur (CLOUD, PORTAL).
#    - Poziom 3: Trzeci strzał zwiększa limit naciągnięcia do +150% (maks. 250% obrażeń bazowych).
#                Jeśli gracz posiada żywioł ognia (Fire), wszyscy przebici i przyciągnięci wrogowie zostają podpaleni na 4 sekundy (80 ticks).
#
# 2. RĘKAWICA ELEKTRYCZNA AMONA (AMON_GLOVE)
#    - Materiał bazowy: GOLDEN_HOE (Złota Motyka - dla obsługi paska naładowania durability)
#    - Obrażenia bazowe: 1.0 HP (konfigurowalne)
#    - Każdy atak wręcz zadaje lekki knockback i ładuje 1 poziom mocy elektrycznej (wywalono spowolnienie na Poziomie 1).
#    - Poziom naładowania wyświetla się jako transient BossBar nad ekranem gracza (podobny do Flameweave i Bloodarrow).
#    - Moc elektryczna zanika o 1 poziom co 4 sekundy bezczynności.
#    - Liczba ładunków wymagana do pełnego naładowania:
#        * Poziom 1: 5 ładunków
#        * Poziom 2: 4 ładunki
#        * Poziom 3: 3 ładunki
#    - Przy pełnym naładowaniu, kolejny atak zadaje 150% obrażeń bazowych oraz wystrzeliwuje ionization chain lightning:
#        * Piorun łańcuchowy skacze po wrogach w promieniu 6 bloków (maks. 2 trafienia na wroga).
#        * Zadaje 100% obrażeń bazowych i zostawia ślady iskier elektrycznych (ELECTRIC_SPARK).
#    - Poziom 1: Bazowy piorun i knockback.
#    - Poziom 2: Jeśli gracz posiada żywioł ziemi (Earth), ataki zadają silniejszy knockback oraz nakładają Slowness II na 3 sekundy.
#                Zabicie wroga daje 25% szansy na efekt Absorption I na 5 sekund.
#    - Poziom 3: Trafienia piorunem łańcuchowym ogłuszają wrogów (Slowness X) oraz oślepiają (Blindness I) na 1 sekundę.
#
# 3. MIECZE NIEBIESKIEGO DUCHA (BLUE_SPIRIT_SWORDS)
#    - Materiał bazowy: STONE_SWORD (Kamienny Miecz)
#    - Obrażenia bazowe: 2.0 HP (konfigurowalne)
#    - Mechanika Dual-wielding: Trzymanie miecza w głównej ręce automatycznie tworzy lewy miecz (BLUE_SPIRIT_SWORDS_OFFHAND) w drugiej dłoni.
#    - Poprzedni przedmiot z drugiej dłoni zostaje tymczasowo ukryty i bezpiecznie przywrócony po zmianie broni lub wyjściu z lochu.
#    - Gracz nie może wyrzucić ani manualnie kliknąć lewego miecza w ekwipunku.
#    - Poziom 1: Atak w cel inny niż ostatnio trafiony gwarantuje 100% szansy na Fizyczny Kryt.
#    - Poziom 2: Brak ataku przez 5 sekund (stan bezczynności) zwiększa obrażenia następnego ciosu krytycznego o +50% (+0.50 do crit damage).
#    - Poziom 3: Trafienie krytyczne ma 33% szansy na uleczenie gracza o 2.0 HP.
#                Jeśli gracz posiada żywioł ognia (Fire), ciosy krytyczne podpalają cel na 3 sekundy, a trzymanie broni pasywnie daje +25% szansy na fizyczny kryt.
#
# 4. OBUCH ZIEMI (EARTH_MACE)
#    - Materiał bazowy: STONE_AXE (Kamienny Topór)
#    - Obrażenia bazowe: 3.0 HP (konfigurowalne)
#    - Zaczyna z 5% durability (ataki nie niszczą narzędzia).
#    - Poziom 1: Posiadanie broni w ekwipunku (EQ) podwaja statystykę obrony gracza (DEF * 2.0).
#                Otrzymywanie obrażeń (przed redukcją z DEFa) ładuje durability: każde otrzymane serce obrażeń (2.0 HP) ładuje o 25% (1.0 HP = 12.5%).
#                Przy 100% durability, następny fizyczny atak zadaje 200% obrażeń bazowych i zeruje naładowanie do 5%.
#    - Poziom 2: Wzmocniony atak przy 100% naładowania zadaje 250% obrażeń bazowych.
#                Bycie leczonym również ładuje durability: każde otrzymane serce leczenia (2.0 HP regain) ładuje o 25% (1.0 HP = 12.5%).
#    - Poziom 3: Co sekundę nie będąc w powietrzu (player.isOnGround()), durability rośnie biernie o 10%.
#                Jeśli gracz ma magię Ziemi (Earth): mając broń w EQ, zyskuje +1 poziom regeneracji zdrowia w lochach (regenLevel).
#                Jeśli gracz ma magię Powietrza (Air): użycie naładowanego ciosu (przy 100% durability) nakłada na atakującego gracza efekty Slowness II i Blindness I na 3 sekundy, a naładowany atak nakłada na cel 10 stacków dźwięku (Soundability).
#
# 5. SIERP WIATRU (WIND_SICKLE)
#    - Materiał bazowy: IRON_SWORD (Żelazny Miecz)
#    - Obrażenia bazowe: 1.0 HP (konfigurowalne)
#    - Zaczyna z 5% durability.
#    - Mechanika Dual-wielding: Trzymanie sierpa w głównej ręce automatycznie tworzy lewy sierp (WIND_SICKLE_OFFHAND) w offhandzie, backupując poprzedni przedmiot.
#    - Poziom 1: Poruszanie się (mając broń w EQ) co sekundę ładuje durability o 3%.
#                Co 25% durability, broń zadaje dodatkowe obrażenia fizyczne (od 100% do 200% obrażeń bazowych).
#                Co kolejne 33% durability, szybkość gracza wzrasta o jeden poziom (+0.02 speedBoost, do maks. +0.06 przy 100%).
#    - Poziom 2: Bierne ładowanie z ruchu rośnie do 4.5% co sekundę.
#                Przy durability powyżej 90%, kliknięcie PPM trzymając sierp w ręce odpala umiejętność:
#                * Odrzuca pobliskich wrogów w promieniu 6 bloków.
#                * Nakłada 10 stacków dźwięku (Soundability) na cele.
#                * Daje wszystkim graczom w lochu efekty Speed I i Jump Boost I na 5 sekund.
#                * Zużywa naładowanie i przywraca durability do początkowych 5%.
#    - Poziom 3: Maksymalny limit obrażeń fizycznych z naładowania rośnie do 250% obrażeń bazowych.
#                Umiejętność PPM:
#                * Nakłada 20 stacków dźwięku zamiast 10.
#                * Leczy wszystkich graczy w lochu o 1 serce (2.0 HP).
#                * Jeśli mag Wody: leczenie rośnie do 2 serc (4.0 HP), a sojusznicy otrzymują Speed II zamiast Speed I.
#                * Jeśli mag Powietrza: zyskiwane durability z ruchu rośnie do 6% co sekundę, a trzymanie sierpa daje pasywny +1 poziom uniku (DODGE).
#                * Jeśli mag Ognia: ataki na podpalone cele przy 100% naładowania zadają 300% obrażeń bazowych.
#
# 6. KOSTUR MAGÓW WODY (WATER_STAFF)
#    - Materiał bazowy: STICK (Patyk)
#    - Obrażenia bazowe: 1.0 HP (konfigurowalne)
#    - Zaczyna z 99% durability.
#    - Poziom 1: Posiadanie w EQ/Blessingu zwiększa statystyki HP o +1 poziom (+4.0 HP boost) oraz M_CritRate o +1 poziom (+10%).
#                Co sekundę, gdy gracz nie trzyma kostura w głównej ręce, ładuje durability o 2%.
#                Kucnięcie (Sneak) trzymając kostur w ręce zużywa 24% durability na sekundę, wyzwalając obszarową aurę (promień 6 bloków):
#                * Wrogowie otrzymują Slowness II na 3 sekundy.
#                * Wrogowie i sojusznicy zostawiają pod nogami śnieg (SNOW).
#                * Sojusznicy są leczeni o 0.5 serca (1.0 HP) na sekundę.
#                * Nie można używać leczenia przy durability < 24%.
#    - Poziom 2: Za każdą przypisaną umiejętność leczenia lub magii krwi w slocie ProjectKorra (subelement Healing lub Blood), kostur zadaje +50% obrażeń bazowych (maks. 300%).
#                Ataki kosturem odpychają grupy wrogów w promieniu 4 bloków od celu.
#                Wybranie tego błogosławieństwa zwiększa Magic Crit Rate wszystkich graczy w lochu o jeden poziom (+10%).
#    - Poziom 3: Posiadanie w EQ/Blessingu zwiększa HP oraz M_CritRate o kolejny, drugi poziom (+8.0 HP, +20% magic crit rate).
#                Jeśli mag Powietrza: zwiększa bierne ładowanie kostura w EQ o 1% (do 3% na sekundę).
#                Jeśli mag Ognia: każde zabójstwo potwora ładuje kostur o 10%.
#                Jeśli mag Ziemi: nakłada klątwę -3 poziomy HP (-12.0 HP boost), a koszt aury leczenia rośnie do 33% durability na sekundę.
#
# 7. SZTYLETY MAI (MAI_DAGGERS)
#    - Materiał bazowy: GOLDEN_SWORD (Złoty Miecz)
#    - Obrażenia bazowe: 1.0 HP (konfigurowalne)
#    - Mechanika Dual-wielding: Trzymanie sztyletu w głównej ręce automatycznie tworzy lewy sztylet (MAI_DAGGERS_OFFHAND) w offhandzie.
#    - Durability broni: Pasywnie rośnie o 10.0% na sekundę, gdy broń jest trzymana. Każde udane trafienie wręcz ładuje o 33.0%.
#    - Umiejętność PPM: Przy 100% durability, kliknięcie PPM wystrzeliwuje latające sztylety (bez zabierania mieczy z EQ):
#        * Poziom 1 & 2: Wystrzeliwuje 2 sztylety rozproszone poziomo.
#        * Poziom 3: Wystrzeliwuje 3 sztylety (lewy, prosty, prawy).
#    - Cechy pocisków sztyletów:
#        * Zadają 150% (Poziom 1) lub 200% (Poziom 2 & 3) obrażeń bazowych.
#        * Nakładają efekty Slowness II oraz Blindness I na 4 sekundy.
#        * Oznaczają trafionych wrogów (Glow cząsteczki nad głową) na 5 sekund (Poziom 1 & 2) lub 7 sekund (Poziom 3).
#    - Bonusy z oznaczenia:
#        * Gracz zyskuje Speed II na 1.5 sekundy jeśli idzie/patrzy w stronę jednego ze swoich oznaczonych wrogów (dystans < 25 bloków, dot product spojrzenia > 0.6).
#        * Zabicie oznaczonego wroga natychmiast ulecza gracza o 4.0 HP (2 serca) i daje niewidzialność na 1 sekundę.
#    - Synergie żywiołów:
#        * Magia Ognia (Fire): Rzucone sztylety dodatkowo podpalają wroga na cały czas trwania oznaczenia (5 lub 7 sekund).
#        * Magia Wody (Water - Poziom 2): Rzucone sztylety zadają tylko 100% obrażeń bazowych, ale zabicie oznaczonego wroga leczy wszystkich graczy w lochu o 4.0 HP.
#        * Poziom 2 DOT: Oznaczeni wrogowie co sekundę otrzymują obrażenia równe 25% obrażeń bazowych (baseDamage * 0.25).
#
# =========================================================================
# CZĘŚĆ VIII: ULEPSZENIA SKRZYŃ I SYSTEM STARTOWEGO EKWIPUNKU (DUNGBUILD)
# =========================================================================
# 1. Filtrowanie Skrzyń (blessing_type & slots)
#    Efekt SPAWN_CHEST obsługuje dodatkowe parametry w skrypcie YAML:
#    - blessing_type: Chest_General / Chest_Stats / Chest_Abilities / Chest_Blessings
#        * Chest_Stats: Skrzynia zawiera wyłącznie ulepszenia statystyk lochu (Allowed Stats).
#        * Chest_Abilities: Skrzynia zawiera wyłącznie ruchy do wyboru (Allowed Skills).
#        * Chest_Blessings: Skrzynia zawiera wyłącznie błogosławieństwa/bronie legendarne (Allowed Blessings).
#        * Chest_General: Skrzynia zawiera tradycyjną, losową mieszankę wszystkich typów nagród.
#    - slots: Określa dokładną liczbę slotów z nagrodami do wyboru (od 1 do 5).
#        Układy slotów są automatycznie centrowane w GUI:
#        * 1 slot: [13]
#        * 2 sloty: [11, 15]
#        * 3 sloty: [11, 13, 15]
#        * 4 sloty: [10, 12, 14, 16]
#        * 5 slotów: [11, 12, 13, 14, 15]
#
# 2. System Początkowych Ulepszeń (/dungbuild)
#    Gracze mogą otworzyć specjalny panel wyboru początkowego ekwipunku komendą `/dungbuild`.
#    Zasady systemu:
#    - Dostęp do ulepszeń i maksymalny limit wyborów (MaxChoices) zależy od poziomu Dungeoneering.
#    - Wybrane ulepszenia są automatycznie przyznawane graczowi w momencie wejścia na jakikolwiek loch.
#    - Konfiguracja ulepszeń, poziomów i slotów znajduje się w pliku `dung_build.yml`.
#
# =========================================================================
# CZĘŚĆ X: KORDY ZAMROŻENIA ALL_PLAYERS_READY ORAZ WARUNEK DYNAMIC_PATH (LABIRYNT ŚCIEŻKI)
# =========================================================================
# 1. Kordy i Zamrożenie w Warunku ALL_PLAYERS_READY
#    Warunek `ALL_PLAYERS_READY` umożliwia zdefiniowanie dokładnych kordów spawn/oczekiwania oraz zamrożenia graczy:
#    - x, y, z: Kordy przeteleportowania gracza przy wejściu do lobby/odliczania.
#    - yaw, pitch: Kąt patrzenia kamery gracza.
#    - freeze: true (Gracze nie mogą się poruszać z tych kordów ani obracać kamerą, dopóki wszyscy nie zaakceptują / odliczanie się nie skończy).
#    Przykład YAML:
#      conditions:
#        - type: ALL_PLAYERS_READY
#          x: 10.5
#          y: 65.0
#          z: 20.5
#          yaw: 90.0
#          pitch: 0.0
#          freeze: true
#
# 2. Warunek/Zdarzenie DYNAMIC_PATH (Dynamiczny Labirynt Ścieżki)
#    Mechanika `DYNAMIC_PATH` generuje losową, 1-blokową połączoną bezpieczną ścieżkę w obszarze bloków od `start` do `end`:
#    - min: {x: 10, y: 64, z: 10} / max: {x: 20, y: 64, z: 30} (Obszar podłogi)
#    - start-x, start-y, start-z / end-x, end-y, end-z: Punkty startowe i końcowe ścieżki.
#    - safe-block-material: CRACKED_DEEPSLATE_BRICKS (Materiał bezpiecznej ścieżki)
#    - crumble-block-material: CRACKED_DEEPSLATE_BRICKS (Materiał fałszywych bloków)
#    - Kary za błędny krok: Stanięcie na blok poza ścieżką rozpada go (TempBlock AIR z efektami) i siłą ciągnie gracza w dół aż dotknie pierwszego bloku podłoża.
#    - reveal-x, reveal-y, reveal-z, reveal-radius: Stanięcie w strefie reveal podświetla bezpieczną ścieżkę partiklami (END_ROD/GLOW) TYLKO GRACZOWI stojącemu w strefie.
#    - reshuffle-interval-seconds: Opcjonalna zmiana ścieżki co X sekund (zachowuje pozycje graczy).
#    Przykład YAML:
#      conditions:
#        - type: DYNAMIC_PATH
#          min-x: 91
#          min-y: 48
#          min-z: -17
#          max-x: 83
#          max-y: 48
#          max-z: -33
#          start-x: 91
#          start-y: 48
#          start-z: -17
#          end-x: 83
#          end-y: 48
#          end-z: -33
#          reveal-x: 89
#          reveal-y: 51
#          reveal-z: -13
#          reveal-radius: 2
#          safe-block-material: CRACKED_DEEPSLATE_BRICKS
#          crumble-block-material: CRACKED_DEEPSLATE_BRICKS
#          reshuffle-interval-seconds: 10


