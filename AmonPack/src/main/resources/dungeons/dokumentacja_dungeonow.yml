# =========================================================================
# PODRĘCZNIK SKRYPTOWANIA DUNGEONÓW - KOMPLETNY PRZEWODNIK (AMONPACK LOCHY V2)
# =========================================================================
# Ten plik stanowi oficjalny poradnik i kompletną dokumentację techniczną
# dla systemu dynamicznych lochów rogue-lite wtyczki AmonPack.
# Wszystkie sekcje, właściwości, efekty, warunki, bronie i mechaniki
# zostały szczegółowo opisane poniżej wraz z dokładnymi parametrami
# oraz przejrzystymi, gotowymi przykładami konfiguracji YAML.
#
# SPIS TREŚCI:
#   CZĘŚĆ I:    STRUKTURA GŁÓWNA SZABLONU LOCHU
#   CZĘŚĆ II:   REJESTR PRZEDMIOTÓW NIESTANDARDOWYCH (items & consumables)
#   CZĘŚĆ III:  SKRZYNIA ULEPSZEŃ I STATYSTYKI ROGUE-LITE (loot-chest)
#   CZĘŚĆ IV:   NAGRODY KOŃCOWE (rewards)
#   CZĘŚĆ V:    KOMPLETNY KATALOG WARUNKÓW (Conditions)
#   CZĘŚĆ VI:   KOMPLETNY KATALOG EFEKTÓW (Effects)
#   CZĘŚĆ VII:  SYSTEM DYNAMICZNYCH PLATFORM (platforms)
#   CZĘŚĆ VIII: ZAAWANSOWANA KONTROLA ETAPÓW, POOLE I NAWIGACJA
#   CZĘŚĆ IX:   SYSTEM LEGENDARNYCH BRONI (Błogosławieństwa Broni)
#   CZĘŚĆ X:    ULEPSZENIA SKRZYŃ I SYSTEM STARTOWEGO EKWIPUNKU (/dungbuild)
#   CZĘŚĆ XI:   ZAMROŻENIE W ALL_PLAYERS_READY ORAZ WARUNEK DYNAMIC_PATH
#   CZĘŚĆ XII:  WARUNEK/MECHANIKA REBUILD (STOPNIOWA ODBUDOWA POLA)
#   CZĘŚĆ XIII: WARUNEK/MECHANIKA HIT_TARGETS (ZBIJANIE LATAJĄCYCH CELÓW)
#   CZĘŚĆ XIV:  PRZYKŁADOWY PEŁNY ENCOUNTER Z NOWYMI MECHANIKAMI
#
# =========================================================================
# CZĘŚĆ I: STRUKTURA GŁÓWNA SZABLONU LOCHU
# =========================================================================
# Każdy szablon lochu musi posiadać poprawny format nagłówka konfigurującego
# parametry bazowe, rejestr przedmiotów, skrzynię ulepszeń oraz nagrody.

name: "&6Komnata Cieni"                  # Unikalna, wyświetlana nazwa lochu (obsługuje kolory &)
schematic: "komnata_cieni.schem"         # Nazwa pliku WorldEdit .schem/.schematic znajdującego się w folderze wtyczki
paste-location:
  x: 0                                   # Koordynaty wklejenia schematu w nowo utworzonym świecie instancji
  y: 60
  z: 0
spawn-location:
  x: 0                                   # Początkowy punkt startowy (teleport graczy po wejściu do lochu)
  y: 61
  z: 0
exit-location:
  world: "world"                         # Świat docelowy po zakończeniu lub opuszczeniu lochu
  x: 100
  y: 64
  z: 100
initial-encounter: "ENC1"                # Pierwszy, startowy etap lochu, od którego rozpoczyna się gra

# =========================================================================
# CZĘŚĆ II: REJESTR PRZEDMIOTÓW NIESTANDARDOWYCH (items)
# =========================================================================
# Sekcja umożliwiająca tworzenie unikalnych kluczy, rzucanych pocisków oraz
# materiałów eksploatacyjnych (consumables). Przedmioty te są automatycznie
# rejestrowane i mogą być wręczane, rzucane lub używane w warunkach.
#
# Typy przedmiotów:
#   1. typ: "key" - Zwykły przedmiot funkcyjny (np. klucz do wrót, artefakt).
#   2. typ: "throwable" - Pocisk rzucany PPM z trajektorią balistyczną i cząsteczkami.
#   3. typ: "consumable" / "consumables" - Przedmiot jednorazowy dający czasowe buffy lub leczenie.
#
# Parametry konfiguracji przedmiotu:
#   - material: Materiał bazowy przedmiotu ze Spigota (np. TRIPWIRE_HOOK, FIRE_CHARGE, POTION)
#   - nazwa / name: Nazwa wyświetlana przedmiotu w ekwipunku (obsługuje kolory &)
#   - opis / lore: Kilkulinijkowy opis lore przedmiotu (Lista String)
#   - typ / type: "key", "throwable" lub "consumable"
#   - custom-model-id: (Opcjonalne) CustomModelData dla ItemsAdder / ResourcePack (Integer)
#
# Parametry dedykowane dla "consumable":
#   - use-mode / tryb-uzycia:
#       * PPM: Szybkie, natychmiastowe użycie prawym przyciskiem myszy.
#       * SNEAK / SHIFT: Rytualne ładowanie kucaniem przez 2.5 sekundy.
#   - effect / efekt:
#       * heal: Uleczenie o zdefiniowaną wartość HP (np. 4.0 HP = 2 serca).
#       * speed: Zwiększa statystykę prędkości lochowej (speedBoost) o [wartość] na [czas-trwania] sekund.
#       * jumpboost: Nadaje efekt Jump Boost o poziomie [wartość] na [czas-trwania] sekund.
#       * damage_boost: Zwiększa statystykę mnożnika obrażeń (dmgMultiplier) o [wartość] (np. 0.2 = +20%) na [czas-trwania] sekund.
#       * hp_boost: Zwiększa statystykę maksymalnego zdrowia (hpBoost) o [wartość] (np. 4.0 = +2 serca) na [czas-trwania] sekund z uleczeniem.
#       * crit_rate_boost: Zwiększa szansę na Fizyczny i Magiczny Krytyk o [wartość] (np. 0.15 = 15%) na [czas-trwania] sekund.
#   - duration / czas-trwania: Czas trwania efektu w sekundach.
#   - value / wartosc: Wartość liczbowa (moc/poziom) efektu.
#
# Przykład rejestru przedmiotów:
items:
  cien_klucz:
    material: "TRIPWIRE_HOOK"
    nazwa: "&6Klucz Bramy Cieni"
    opis:
      - "&7Służy do otwarcia starożytnych wrót."
    typ: "key"
    custom-model-id: 1001
  cien_kamien:
    material: "FIRE_CHARGE"
    nazwa: "&cOgnisty Pocisk"
    opis:
      - "&7Rzuć nim PPM, aby trafić w cel lub rozbić tarczę bossa!"
    typ: "throwable"
    custom-model-id: 1002
  mikstura_sily:
    material: "POTION"
    nazwa: "&c&lEliksir Gniewu"
    opis:
      - "&7Przytrzymaj SHIFT (kucanie), aby wypić."
      - "&7Zwiększa siłę ataku o 20% na 15 sekund."
    typ: "consumable"
    tryb-uzycia: "SNEAK"
    efekt: "damage_boost"
    czas-trwania: 15
    wartosc: 0.20
    custom-model-id: 2005

# =========================================================================
# CZĘŚĆ III: SKRZYNIA ULEPSZEŃ I STATYSTYKI ROGUE-LITE (loot-chest)
# =========================================================================
# Definiuje dozwolone statystyki i ulepszenia rogue-lite (błogosławieństwa)
# wypadające ze skrzyni w trakcie rozgrywki lochu.
#
# Statystyki bazowe (allowed-stats):
#   - HP: Zwiększa maksymalne zdrowie (+4 HP / +2 Serca).
#   - DEF: Zwiększa obronę (+10 DEF), zmniejszając procentowo otrzymywane obrażenia.
#   - DMG: Zwiększa zadawane obrażenia fizyczne i magiczne o 15% (+0.15).
#   - SPEED: Zwiększa prędkość poruszania się (+10% / +0.02).
#   - P_CRIT_RATE: Szansa na Fizyczny Kryt bronią lub pięścią (+10% szansy). Bazowa: 5%.
#   - P_CRIT_DMG: Mnożnik obrażeń Fizycznego Kryta (+20% mocy). Bazowa: +50% (x1.5).
#   - M_CRIT_RATE: Szansa na Magiczny Kryt umiejętnościami/czarami (+10% szansy). Bazowa: 5%.
#   - M_CRIT_DMG: Mnożnik obrażeń Magicznego Kryta (+20% mocy). Bazowa: +50% (x1.5).
#   - REGEN: Regeneracja lochowa. Naturalna regeneracja w lochach jest wyłączona.
#            Każdy poziom REGEN leczy gracza o 10% maksymalnego HP co 10 sekund.
#
# Błogosławieństwa (allowed-blessings):
#   Każde wylosowanie już odblokowanego błogosławieństwa podnosi jego poziom (Tier).
#   Wszystkie błogosławieństwa mają bazową szansę aktywacji równą 5% * Poziom.
#   - VAMPIRISM: Szansa (5% * lvl) przy zabiciu płonącego przeciwnika na uleczenie o 4 HP (2 serca).
#   - DODGE: Szansa (5% * lvl) na całkowity unik i anulowanie otrzymywanych obrażeń.
#   - ADRENALINE: Szansa (5% * lvl) przy zadawaniu obrażeń mając poniżej 20% HP na zwiększenie ich o 50% (+0.50).
#   - LIFESTEAL: Trafienia mają szansę (5% * lvl) uleczyć gracza o 20% zadanych obrażeń.
#   - HEAL: Otrzymane leczenie ma szansę (5% * lvl) zostać wzmocnione o 50% (+0.50).
#   - KNOCKBACK: Ataki mają szansę (5% * lvl) mocno odrzucić wroga w tył.
#   - COUNTER: Szansa (5% * lvl) na zignorowanie obrażeń i natychmiastowe odbicie ich w atakującego.
#   - FLAMING: Ataki mają szansę (5% * lvl) podpalić wroga na 4 sekundy za każdy poziom (4s * lvl).
#   - POISON: Fizyczne ataki mają szansę (5% * lvl) otruć wroga na 4 sekundy.
#   - COMBUSTION: Ataki w podpalonych wrogów mają szansę (5% * lvl) zadać zwiększone o 25% obrażenia.
#
# Inne mechaniki walki lochów:
#   * Blokada ognia: Moby płonące w lochach nie podpalają graczy przy ataku (vanilla combust zablokowany).
#   * Kompas gotowości / rozpoczęcie etapu: Daje wszystkim graczom pełne uleczenie i nasycenie głodu.
#
# Przykład konfiguracji w pliku lochu:
loot-chest:
  allowed-stats:
    - HP
    - DEF
    - DMG
    - SPEED
    - P_CRIT_RATE
    - P_CRIT_DMG
    - M_CRIT_RATE
    - M_CRIT_DMG
    - REGEN
  allowed-blessings:
    - VAMPIRISM
    - DODGE
    - ADRENALINE
    - LIFESTEAL
    - HEAL
    - KNOCKBACK
    - COUNTER
    - FLAMING
    - POISON
    - COMBUSTION

# =========================================================================
# CZĘŚĆ IV: NAGRODY KOŃCOWE (rewards)
# =========================================================================
# Nagrody przyznawane wszystkim graczom po pomyślnym ukończeniu lochu.
#
# Właściwości:
#   - dungeon-xp: Doświadczenie poziomu lochu (Integer)
#   - money: Waluta w grze (Double)
#   - commands: Lista komend wykonywanych przez konsolę (%player% zastępuje gracza)
#   - items: Dowolna liczba niestandardowych przedmiotów do wręczenia

rewards:
  dungeon-xp: 250
  money: 500
  commands:
    - "give %player% gold_ingot 5"
  items:
    nagroda_miecz:
      material: "DIAMOND_SWORD"
      amount: 1
      display-name: "&cMiecz Cienia"
      lore:
        - "&7Potężne ostrze wyjęte z ruin."

# =========================================================================
# CZĘŚĆ V: KOMPLETNY KATALOG WARUNKÓW (Conditions)
# =========================================================================
# Warunki (conditions) określają wymagania do ukończenia danego etapu (Encounter).
# Mogą zawierać sekcję 'oncomplete' - listę efektów wyzwalanych przy ukończeniu
# tego konkretnego warunku.
#
# SYSTEM LOSOWANIA WSPÓŁRZĘDNYCH (xList, yList, zList):
# Każdy warunek lub efekt używający współrzędnych XYZ może przyjąć listę koordynatów w formacie YAML,
# np.:
#   x: [10.0, 20.0, 30.0]
#   y: [61.0, 62.0, 63.0]
#   z: [-5.0, -10.0, -15.0]
# Wtyczka wylosuje pojedynczy indeks z list współrzędnych dla danego uruchomienia instancji lochu
# i zachowa go jako stały na całą sesję instancji, co umożliwia unikalny układ lochu przy każdym wejściu!
#
# 1. ALL_PLAYERS_READY
#    Sprawdza, czy wszyscy gracze kliknęli gotowość przy użyciu Kompasu Gotowości.
#    Obsługuje pozycję lobby i opcjonalne zamrożenie kamery/ruchu graczy (freeze).
#    Parametry: x, y, z (Double), yaw, pitch (Float), freeze (Boolean, domyślnie false)
#    Przykład:
#      - type: "ALL_PLAYERS_READY"
#        x: 10.5
#        y: 65.0
#        z: 20.5
#        yaw: 90.0
#        pitch: 0.0
#        freeze: true
#
# 2. PLAYER_ENTER_AREA
#    Zwraca prawda, jeśli gracze wejdą w obszar o promieniu R od punktu XYZ.
#    Parametry: x, y, z (Double), radius (Double), required_all_players (Boolean, domyślnie false)
#    Przykład:
#      - type: "PLAYER_ENTER_AREA"
#        x: 10.0
#        y: 61.0
#        z: -5.0
#        radius: 2.5
#        required_all_players: true
#
# 3. KILL_MOBS
#    Zaliczane gdy gracze pokonają wymaganą liczbę potworów o danej nazwie.
#    Śmierć moba jest rejestrowana z DOWOLNEGO źródła (ataki, magia, upadek, ogień).
#    Parametry: mob-name (String) typ moba np. ZOMBIE lub nazwa MythicMobsa / displayname, amount (Integer)
#    Przykład:
#      - type: "KILL_MOBS"
#        mob-name: "ZOMBIE"
#        amount: 5
#
# 4. INTERACT_BLOCK_WITH_ITEM
#    Zaliczane przy kliknięciu PPM na określony blok za pomocą przedmiotu z rejestru lub gołą ręką.
#    Parametry: x, y, z (Double), radius (Double, promień dozwolonego kliknięcia),
#               block-material (Material), item-material (ID przedmiotu z rejestru lub materiał Spigot),
#               required_items (Boolean, domyślnie true. Jeśli false, warunek zaliczy się bez trzymania itemu).
#    Przykład:
#      - type: "INTERACT_BLOCK_WITH_ITEM"
#        x: 5.0
#        y: 62.0
#        z: 10.0
#        radius: 3.5
#        block-material: "IRON_DOOR"
#        item-material: "cien_klucz"
#        required_items: true
#
# 5. ZONE
#    Przejęcie wyznaczonej strefy (okręgu na ziemi) poprzez stanie w niej łącznie przez X sekund.
#    Wychodzenie ze strefy cofa postęp o 1 sekundę na sekundę nieobecności. Rysuje cząsteczki GLOW.
#    Parametry: x, y, z (Double), radius (Double), time (Sekundy, Integer)
#    Przykład:
#      - type: "ZONE"
#        x: 15.0
#        y: 61.0
#        z: 15.0
#        radius: 3.0
#        time: 20
#
# 6. THROW_AT
#    Trafienie rzucanym pociskiem (typu PPM 'throwable') w określone współrzędne X razy.
#    Parametry: x, y, z (Double), radius (Double), item (ID pocisku), amount (Integer),
#               is-returning (Boolean, opcjonalne, domyślnie false. Jeśli true, chybiony rzut wraca do EQ!)
#    Przykład:
#      - type: "THROW_AT"
#        x: 20.0
#        y: 65.0
#        z: 0.0
#        radius: 1.5
#        item: "cien_kamien"
#        amount: 3
#        is-returning: true
#
# 7. SHIELDED
#    Mechanika przeciwnika z tarczą (odpornego na zwykły DMG). Tarcza musi zostać zniszczona,
#    a sam boss ostatecznie zabity.
#    Parametry:
#      - mob-name: Nazwa kodowa potwora / MythicMobsa
#      - mob-display-name: (Opcjonalne) Wyświetlana nazwa displayname bossa w grze
#      - item: ID przedmiotu z rejestru, którym należy rzucać w trybie 'throw'
#      - amount: Wymagana ilość celnych rzutów
#      - shield-type: "throw" (zdejmowana rzutami) lub "event_removable" (zdejmowana efektem SHIELD_REMOVE)
#      - x, y, z: Współrzędne spawnu bossa
#    Przykład:
#      - type: "SHIELDED"
#        mob-name: "ShadowGhost"
#        mob-display-name: "Cień Bossa"
#        item: "cien_kamien"
#        amount: 4
#        shield-type: "throw"
#        x: 0.0
#        y: 65.0
#        z: 10.0
#
# 8. DROP_ON_DEATH
#    Szansa na natychmiastowe otrzymanie przedmiotu do ekwipunku po śmierci wskazanego moba.
#    Parametry: mob-name (String), item (ID przedmiotu z rejestru), chance (Double 0.0-100.0)
#    Przykład:
#      - type: "DROP_ON_DEATH"
#        mob-name: "ZOMBIE"
#        item: "cien_kamien"
#        chance: 50.0
#
# 9. PERIODIC_CHECK
#    Cyklicznie co X sekund sprawdza wyznaczony stan graczy. Niezaliczenie uruchamia kary/efekty fail-effects,
#    zaliczenie wyzwala success-effects.
#    Parametry:
#      - interval: interwał czasu w sekundach (Integer)
#      - requirement: Wymóg do sprawdzenia (String):
#          * SNEAKING (wszyscy gracze kucają)
#          * IN_AIR (wszyscy gracze w powietrzu)
#          * SPRINTING (wszyscy gracze biegną)
#          * MOVING (wszyscy gracze w ruchu w ostatniej sekundzie)
#          * NEAR_EACH_OTHER (wszyscy gracze w odległości max 6.0 bloków od siebie)
#          * AWAY_FROM_EACH_OTHER,<dystans> (gracze oddaleni o min. podany dystans, np. AWAY_FROM_EACH_OTHER,10.0)
#          * HAVE_ITEMS:<id>,<ilość>;<id2>,<ilość> (przynajmniej jeden gracz posiada przedmioty)
#          * ALL_HAVE_ITEMS:<id>,<ilość>;<id2>,<ilość> (wszyscy gracze posiadają przedmioty)
#      - once: (Boolean, opcjonalne) Jeśli true, pierwszy sukces trwale wyłącza sprawdzanie w danym etapie.
#      - fail-effects: Lista efektów wykonywanych przy porażce.
#      - success-effects: Lista efektów wykonywanych przy sukcesie.
#    Przykład:
#      - type: "PERIODIC_CHECK"
#        interval: 30
#        requirement: "ALL_HAVE_ITEMS:cien_klucz,1"
#        once: true
#        fail-effects:
#          - type: "DAMAGE"
#            amount: 4
#          - type: "SEND_MESSAGE"
#            message: "&cNikt z was nie posiada klucza! Otrzymujecie obrażenia."
#        success-effects:
#          - type: "SEND_MESSAGE"
#            message: "&aZadanie zaliczone! Wszyscy gracze posiadają wymagany klucz cieni."
#
# 10. LOOKING_AT
#     Sensor kierunku spojrzenia. Sprawdza, czy chociaż jeden z graczy patrzy bezpośrednio na cel XYZ.
#     Parametry: x, y, z (Double), radius (Double, max dystans gracza), interval (Sekundy powtórzeń kar, Integer)
#     Przykład:
#       - type: "LOOKING_AT"
#         x: 0.0
#         y: 65.0
#         z: 5.0
#         radius: 10.0
#         interval: 5
#         fail-effects:
#           - type: "SPAWN_MOB"
#             mob-name: "SKELETON"
#             amount: 1
#             x: 0.0
#             y: 61.0
#             z: 5.0
#         success-effects:
#           - type: "SEND_MESSAGE"
#             message: "&dKryształ cieni został uwięziony twoim wzrokiem!"
#
# 11. ALIVE
#     Bieżący sensor obecności potworów. Zwraca true jeśli określony potwór o danej nazwie żyje w promieniu R od XYZ.
#     Parametry: x, y, z (Double), radius (Double), mob-name (String), amount (Integer)
#     Przykład:
#       - type: "ALIVE"
#         x: 10.0
#         y: 61.0
#         z: 10.0
#         radius: 20.0
#         mob-name: "Boss_Cienia"
#         amount: 1
#         fail-effects:
#           - type: "OPEN_DOOR"
#             x1: 10.0
#             y1: 60.0
#             z1: -1.0
#             x2: 12.0
#             y2: 63.0
#             z2: -1.0
#           - type: "SEND_MESSAGE"
#             message: "&aBoss poległ! Skalne drzwi do skarbca zostały otwarte!"
#
# 12. COLLECT_POINTS
#     Czasowy warunek zbierania koordynatów. Cząsteczki tworzą pionowy, wznoszący się w niebo efekt BEACONA
#     oraz świecący okrąg na podłożu wyznaczający strefę zebrania. Zmusza graczy do wejścia w zasięg wszystkich punktów
#     przed upływem limitu czasu. Odliczanie rozpoczyna się od pierwszego zebranego punktu.
#     Parametry: radius (Double), time (Sekundy, Integer), points (Lista Stringów 'x,y,z' lub map), fail-effects, success-effects
#     Przykład:
#       - type: "COLLECT_POINTS"
#         radius: 3.0
#         time: 45
#         points:
#           - "15.0,61.0,-10.0"
#           - "25.0,63.0,-8.0"
#           - "10.0,62.0,-15.0"
#         fail-effects:
#           - type: "DAMAGE"
#             amount: 4
#           - type: "SEND_MESSAGE"
#             message: "&cSpóźniliście się! Czas minął, punkty zostały zresetowane!"
#         success-effects:
#           - type: "SEND_MESSAGE"
#             message: "&aDoskonale! Wszystkie punkty cieni zostały zebrane na czas!"
#
# 13. DYNAMIC_PATH (Dynamiczny Labirynt Ścieżki)
#     Generuje losową, połączoną 1-blokową bezpieczną ścieżkę od punktu start do end.
#     Kary: Stanięcie na blok poza ścieżką rozpada go (TempBlock AIR) i ciągnie gracza gwałtownie w dół.
#     Nad strefą nałożony jest ciągły Slowness i blokada magii (Chi-Block).
#     (Szczegóły w CZĘŚCI XI dokumentacji).
#
# 14. REBUILD (Stopniowa Odbudowa Pola / Mostu / Portalu)
#     Czyści wyznaczony obszar na start etapu i płynnie odbudowuje go wraz z postępami w pozostałych warunkach
#     (np. ZONE, KILL_MOBS, HIT_TARGETS).
#     (Szczegóły w CZĘŚCI XII dokumentacji).
#
# 15. HIT_TARGETS (Zbijanie Ruchomych Celów z Paskiem HP)
#     Generuje latające, poruszające się w promieniu offsetu cele z paskiem HP do zniszczenia bronią lub magią.
#     (Szczegóły w CZĘŚCI XIII dokumentacji).

# =========================================================================
# CZĘŚĆ VI: KOMPLETNY KATALOG EFEKTÓW (Effects)
# =========================================================================
# Efekty (effects) są akcjami uruchamianymi przy starcie etapu, na ukończenie
# pojedynczego warunku (oncomplete), bądź okresowo przez sensory.
#
# 1. SEND_MESSAGE
#    Wysyła wiadomość czatu do wszystkich graczy w lochu.
#    Parametry: message (String, obsługuje kolory &)
#    Przykład:
#      - type: "SEND_MESSAGE"
#        message: "&eBrama cieni została otwarta!"
#
# 2. TELEPORT_PLAYERS
#    Teleportuje wszystkich graczy w lochu do wskazanego punktu XYZ.
#    Parametry: x, y, z (Double)
#    Przykład:
#      - type: "TELEPORT_PLAYERS"
#        x: 0.0
#        y: 61.0
#        z: -10.0
#
# 3. SPAWN_MOB
#    Spawnuje wybranego potwora MythicMobs lub vanilla wokół punktu z losowym rozrzutem.
#    Parametry: mob-name (String), amount (Integer), level (Integer), x, y, z (Double), range (Rozrzut, Double)
#    Przykład:
#      - type: "SPAWN_MOB"
#        mob-name: "Spirit_Earth_1"
#        amount: 3
#        level: 1
#        x: 15.0
#        y: 61.0
#        z: 0.0
#        range: 3.5
#
# 4. OPEN_DOOR
#    Otwiera przejście zamieniając bloki w prostopadłościanie x1/y1/z1 -> x2/y2/z2 na AIR.
#    Parametry: x1, y1, z1, x2, y2, z2 (Double)
#    Przykład:
#      - type: "OPEN_DOOR"
#        x1: 5.0
#        y1: 60.0
#        z1: -1.0
#        x2: 8.0
#        y2: 63.0
#        z2: -1.0
#
# 5. CLOSE_DOOR
#    Buduje lub barykaduje przejście określonym blokiem w wyznaczonym prostopadłościanie.
#    Parametry: x1, y1, z1, x2, y2, z2 (Double), material (Material, np. IRON_BARS)
#    Przykład:
#      - type: "CLOSE_DOOR"
#        x1: 5.0
#        y1: 60.0
#        z1: -1.0
#        x2: 8.0
#        y2: 63.0
#        z2: -1.0
#        material: "IRON_BARS"
#
# 6. GIVE_READY_COMPASS
#    Usuwa stare i rozdaje wszystkim graczom Kompas Gotowości oraz Skrzynię Menu Umiejętności.
#    Przykład:
#      - type: "GIVE_READY_COMPASS"
#
# 7. SPAWN_CHEST
#    Tworzy interaktywną skrzynię nagród rogue-lite na danych kordach.
#    Parametry: x, y, z (Double), chest-type (domyślnie 'ROGUELITE_CHEST'),
#               blessing_type (Chest_General / Chest_Stats / Chest_Abilities / Chest_Blessings),
#               slots (Liczba slotów do wyboru w GUI: 1 do 5)
#    Przykład:
#      - type: "SPAWN_CHEST"
#        x: 0.0
#        y: 61.0
#        z: 5.0
#        chest-type: "ROGUELITE_CHEST"
#        blessing_type: "Chest_Blessings"
#        slots: 3
#
# 8. COMPLETE_DUNGEON
#    Wysyła status sukcesu, rozdaje nagrody ze struktury 'rewards' i zamyka świat.
#    Przykład:
#      - type: "COMPLETE_DUNGEON"
#
# 9. SPAWN_UNTIL
#    Cykliczne spawnowanie potworów co X sekund, dopóki etap lochu nie zostanie ukończony.
#    Parametry: mob-name (String), amount (Integer), level (Integer), x, y, z (Double), range (Double), interval (Sekundy, Integer)
#    Przykład:
#      - type: "SPAWN_UNTIL"
#        mob-name: "ZOMBIE"
#        amount: 2
#        level: 1
#        x: 0.0
#        y: 61.0
#        z: 10.0
#        range: 3.0
#        interval: 10
#
# 10. KNOCKBACK
#     Gwałtownie odrzuca wszystkich aktywnych graczy wektorem prędkości XYZ.
#     Parametry: x, y, z (Double)
#     Przykład:
#       - type: "KNOCKBACK"
#         x: 0.0
#         y: 0.6
#         z: -0.8
#
# 11. PULL
#     Przyciąga graczy w stronę koordynatów XYZ z siłą określoną w amount.
#     Parametry: x, y, z (Double), amount (Mnożnik siły, Integer/Double)
#     Przykład:
#       - type: "PULL"
#         x: 10.0
#         y: 65.0
#         z: 10.0
#         amount: 2
#
# 12. DAMAGE
#     Zadaje określoną liczbę punktów bezpośrednich obrażeń wszystkim graczom w instancji.
#     Parametry: amount (Ilość obrażeń, 2 = 1 serce, Integer)
#     Przykład:
#       - type: "DAMAGE"
#         amount: 4
#
# 13. FORCE_FAIL
#     Dramatyczne uśmiercenie całej drużyny. Co sekundę zabiera 10% maksymalnego zdrowia każdemu graczowi,
#     nakładając narastające particle DUST (czerwone) i efekty (Spowolnienie, Ślepota, Nudności).
#     Przykład:
#       - type: "FORCE_FAIL"
#
# 14. GIVE_ITEM
#     Daje wszystkim aktywnym graczom przedmiot z rejestru 'items' lub standardowy materiał Spigota.
#     Bezpiecznie wrzuca item do ręki (jeśli pusta) lub do pierwszego wolnego slotu.
#     Parametry: item (ID przedmiotu z rejestru lub materiału Spigot, String), amount (Ilość, Integer, domyślnie 1)
#     Przykład:
#       - type: "GIVE_ITEM"
#         item: "cien_klucz"
#         amount: 1
#
# 15. SHIELD_REMOVE
#     Usuwa tarcze ze wszystkich osłoniętych bossów w określonej lokalizacji i promieniu.
#     Parametry: x, y, z (Double lub List), radius / range (Promień działania, Double)
#     Przykład:
#       - type: "SHIELD_REMOVE"
#         x: 0.0
#         y: 61.0
#         z: 5.0
#         radius: 5.0

# =========================================================================
# CZĘŚĆ VII: SYSTEM DYNAMICZNYCH PLATFORM (platforms)
# =========================================================================
# Bloki tworzące mosty, zapadnie, przejścia lub labirynty, reagujące w czasie
# rzeczywistym na określone stany lochu.
# Rejestracja może odbywać się na dwa sposoby:
#   1. Globalnie: Zdefiniowana w głównym korzeniu szablonu lochu (obok 'items' lub 'rewards').
#   2. Lokalnie: Zdefiniowana wewnątrz konkretnego etapu pod kluczem 'platforms'.
#
# Właściwości:
#   - x1, y1, z1, x2, y2, z2: Wymiary prostopadłościanu platformy (Double/Integer)
#   - material: Blok z jakiego ma powstać platforma (np. GLASS, OAK_PLANKS)
#   - inverted: Jeśli false - bloki są gdy warunek jest spełniony, znikają gdy nie.
#               Jeśli true - bloki znikają gdy warunek jest spełniony, są gdy nie.
#   - test-mode: GLOBAL (sprawdza gracza w całej instancji) lub NEAR (w promieniu 1.5 bloku od platformy)
#   - requirement: Wybrany warunek fizyczny:
#       * SNEAKING (gracz kuca)
#       * ITEM:<id_przedmiotu> (gracz posiada w dłoni/eq podany przedmiot, np. ITEM:cien_klucz)
#       * MOB_NEAR:<nazwa_moba> (potwór o danej nazwie znajduje się w odległości max 5 bloków od środka platformy)
#   - delay: (Opcjonalne, Integer) Opóźnienie aktywacji/dezaktywacji stanu platformy w sekundach.
#   - check-interval: (Opcjonalne, Integer) Interwał sprawdzania warunku platformy w sekundach.
#
# Przykład kompletnego użycia platformy:
#   platforms:
#     - x1: 5
#       y1: 60
#       z1: 1
#       x2: 7
#       y2: 60
#       z2: 5
#       material: "GLASS"
#       inverted: false
#       test-mode: "NEAR"
#       requirement: "ITEM:cien_klucz"
#       delay: 3
#       check-interval: 5

# =========================================================================
# CZĘŚĆ VIII: ZAAWANSOWANA KONTROLA ETAPÓW, POOLE I NAWIGACJA
# =========================================================================
# Wtyczka obsługuje nieliniowe przechodzenie pokoi, pakiety sekwencyjne oraz nawigację cząsteczkową.
#
# 1. Losowość typu POOL (next: random):
#    Etap wejściowy deklaruje przejście na 'next: random', pulę dozwolonych pokoi 'pool',
#    liczbę wymaganych pokoi do przejścia 'req_clears' oraz etap wyjściowy 'enc_after_clears'.
#
# 2. Pakiet sekwencyjny POOL_LISTS (next: random):
#    Zamiast pojedynczych pokoi, można zadeklarować gotowe, spięte łańcuchy etapów.
#    Plugin wybierze losowo JEDNĄ kompletną listę, w której żaden z etapów nie jest jeszcze zużyty,
#    odegra ją po kolei i przejdzie do 'enc_after_clears'.
#
# Przykład losowości POOL_LISTS:
#   ENC_START:
#     description: "Wybór losowej drogi"
#     conditions:
#       - type: "ALL_PLAYERS_READY"
#     next: "random"
#     pool_lists:
#       - ["ENC_WOJ_1", "ENC_WOJ_2"]
#       - ["ENC_LOW_1", "ENC_LOW_2"]
#     enc_after_clears: "ENC_BOSS"
#
# 3. Ograniczenie liczby potworów w etapie (max_mobs):
#    Opcjonalny parametr 'max_mobs' (Integer) zadeklarowany na poziomie etapu (Encounter).
#    Jeśli w dungeonie znajduje się więcej lub tyle samo żywych potworów, efekty typu SPAWN_MOB
#    oraz SPAWN_UNTIL nie zrodzą dodatkowych wrogów, chroniąc serwer przed lagami.
#
# 4. Automatyczne czyszczenie potworów po zakończeniu etapu (leave_mobs):
#    Domyślnie każdy etap, po pomyślnym ukończeniu wszystkich warunków, automatycznie ZABIJA
#    wszystkie potwory, które sam przyzwał, ZANIM aktywuje się kolejny etap.
#    Ustawienie 'leave_mobs: true' pozwala zachować moby żywe w kolejnym pokoju.
#
# 5. Nawigacja i Ścieżka do Celu Etapu (guide-x, guide-y, guide-z, guide-radius):
#    Każdy etap może posiadać koordynaty celu guide. Jeśli gracz znajduje się dalej niż 'guide-radius'
#    od celu, na ziemi przed nim pojawia się świecący ślad cząsteczek prowadzący prosto do celu!
#    Obsługiwane formaty:
#      * guide-x: 100, guide-y: 64, guide-z: 200, guide-radius: 5
#      * guide: { x: 100, y: 64, z: 200, radius: 5 }

# =========================================================================
# CZĘŚĆ IX: SYSTEM LEGENDARNYCH BRONI (Błogosławieństwa Broni)
# =========================================================================
# Unikalne, ulepszalne bronie otrzymywane ze skrzyń w lochu (Tiers 1-3)
# ze specjalnymi synergiami żywiołów (Fire, Water, Earth, Air).
#
# 1. ŁUK Z POUHAI (POUHAI_BOW)
#    - Materiał bazowy: BOW
#    - Naciąganie łuku zwiększa obrażenia o +25% za każdą sekundę (do maks. +100%).
#    - Co trzeci strzał automatycznie przebija cele (Pierce 10) i ignoruje DEF wrogów.
#    - Poziom 2: Trzeci strzał przyciąga wrogów w promieniu 6 bloków do celu (efekt wiru).
#    - Poziom 3: Naciągnięcie do +150% (250% DMG). Mag Ognia: podpala wrogów na 4 sekundy.
#
# 2. RĘKAWICA ELEKTRYCZNA AMONA (AMON_GLOVE)
#    - Materiał bazowy: GOLDEN_HOE
#    - Ataki wręcz zadają knockback i ładują poziom mocy elektrycznej (wyświetlany na BossBarze).
#    - Przy pełnym naładowaniu wystrzeliwuje piorun łańcuchowy (Ionization Chain Lightning) skaczący po wrogach.
#    - Poziom 2: Mag Ziemi nakłada silniejszy knockback i Slowness II. Zabójstwo daje 25% szansy na Absorption I.
#    - Poziom 3: Piorun ogłusza wrogów (Slowness X) i oślepia (Blindness I) na 1 sekundę.
#
# 3. MIECZE NIEBIESKIEGO DUCHA (BLUE_SPIRIT_SWORDS)
#    - Materiał bazowy: STONE_SWORD
#    - Dual-wielding: Trzymanie miecza tworzy drugi miecz w lewej dłoni.
#    - Poziom 1: Atak w cel inny niż ostatnio trafiony gwarantuje 100% szansy na Fizyczny Kryt.
#    - Poziom 2: Brak ataku przez 5 sekund zwiększa obrażenia następnego kryta o +50%.
#    - Poziom 3: Kryt ma 33% szansy na uleczenie o 2.0 HP. Mag Ognia: podpala na 3s i daje pasywny +25% crit rate.
#
# 4. OBUCH ZIEMI (EARTH_MACE)
#    - Materiał bazowy: STONE_AXE
#    - Poziom 1: Podwaja statystykę obrony gracza (DEF * 2.0). Otrzymane obrażenia ładują durability.
#      Przy 100% durability cios zadaje 200% obrażeń bazowych.
#    - Poziom 2: Cios przy 100% zadaje 250% obrażeń. Otrzymane leczenie również ładuje durability.
#    - Poziom 3: Stanie na ziemi ładuje durability o 10%/s. Mag Ziemi: +1 poziom regeneracji lochowej.
#
# 5. SIERP WIATRU (WIND_SICKLE)
#    - Materiał bazowy: IRON_SWORD (Dual-wielding)
#    - Poziom 1: Ruch ładuje durability o 3%/s. Wyższe naładowanie zwiększa DMG oraz prędkość ruchu gracza.
#    - Poziom 2: PPM przy >90% durability odrzuca wrogów w promieniu 6 bloków i daje drużynie Speed I + Jump Boost I na 5s.
#    - Poziom 3: Umiejętność PPM leczy całą drużynę o 2.0 HP (Mag Wody: 4.0 HP i Speed II).
#
# 6. KOSTUR MAGÓW WODY (WATER_STAFF)
#    - Materiał bazowy: STICK
#    - Poziom 1: Zwiększa HP i M_CritRate. Kucnięcie (Sneak) zużywa durability, lecząc sojuszników o 1.0 HP/s i spowalniając wrogów.
#    - Poziom 2: Zwiększa DMG za przypisane skille leczenia/krwi ProjectKorra. Ataki odpychają grupy wrogów.
#    - Poziom 3: Dalszy wzrost statystyk drużyny. Mag Ognia: zabójstwa ładują kostur o 10%.
#
# 7. SZTYLETY MAI (MAI_DAGGERS)
#    - Materiał bazowy: GOLDEN_SWORD (Dual-wielding)
#    - PPM przy 100% durability wystrzeliwuje wachlarz sztyletów, które spowalniają, oślepiają i oznaczają cele (Glow).
#    - Gracz zyskuje Speed II idąc w stronę oznaczonego wroga, a zabicie go leczy o 4.0 HP i daje niewidzialność na 1s.
#    - Poziom 2: Oznaczeni wrogowie otrzymują obrażenia w czasie (DOT). Mag Wody: zabicie leczy cały team o 4.0 HP.

# =========================================================================
# CZĘŚĆ X: ULEPSZENIA SKRZYŃ I SYSTEM STARTOWEGO EKWIPUNKU (/dungbuild)
# =========================================================================
# 1. Filtrowanie Skrzyń (blessing_type & slots w efekcie SPAWN_CHEST)
#    Efekt SPAWN_CHEST obsługuje dodatkowe parametry w skrypcie YAML:
#    - blessing_type: Chest_General / Chest_Stats / Chest_Abilities / Chest_Blessings
#        * Chest_Stats: Skrzynia zawiera wyłącznie ulepszenia statystyk lochu (Allowed Stats).
#        * Chest_Abilities: Skrzynia zawiera wyłącznie ruchy do wyboru (Allowed Skills).
#        * Chest_Blessings: Skrzynia zawiera wyłącznie błogosławieństwa/bronie legendarne (Allowed Blessings).
#        * Chest_General: Skrzynia zawiera tradycyjną, losową mieszankę wszystkich typów nagród.
#    - slots: Określa dokładną liczbę slotów z nagrodami do wyboru w GUI (od 1 do 5).
#        Układy slotów są automatycznie centrowane w GUI:
#        * 1 slot: [13]
#        * 2 sloty: [11, 15]
#        * 3 sloty: [11, 13, 15]
#        * 4 sloty: [10, 12, 14, 16]
#        * 5 slotów: [11, 12, 13, 14, 15]
#
# 2. System Początkowych Ulepszeń (/dungbuild)
#    Gracze mogą otworzyć specjalny panel wyboru początkowego ekwipunku komendą `/dungbuild`.
#    Zasady systemu:
#    - Dostęp do ulepszeń i maksymalny limit wyborów (MaxChoices) zależy od poziomu Dungeoneering.
#    - Wybrane ulepszenia są automatycznie przyznawane graczowi w momencie wejścia na jakikolwiek loch.
#    - Konfiguracja ulepszeń, poziomów i slotów znajduje się w pliku `dung_build.yml`.

# =========================================================================
# CZĘŚĆ XI: ZAMROŻENIE W ALL_PLAYERS_READY ORAZ WARUNEK DYNAMIC_PATH
# =========================================================================
# 1. Kordy i Zamrożenie w Warunku ALL_PLAYERS_READY
#    Warunek `ALL_PLAYERS_READY` umożliwia zdefiniowanie dokładnych kordów spawn/oczekiwania oraz zamrożenia graczy:
#    - x, y, z: Kordy przeteleportowania gracza przy wejściu do lobby/odliczania.
#    - yaw, pitch: Kąt patrzenia kamery gracza.
#    - freeze: true (Gracze nie mogą się poruszać z tych kordów ani obracać kamerą, dopóki wszyscy nie zaakceptują / odliczanie się nie skończy).
#    Przykład YAML:
#      conditions:
#        - type: ALL_PLAYERS_READY
#          x: 10.5
#          y: 65.0
#          z: 20.5
#          yaw: 90.0
#          pitch: 0.0
#          freeze: true
#
# 2. Warunek/Zdarzenie DYNAMIC_PATH (Dynamiczny Labirynt Ścieżki)
#    Mechanika `DYNAMIC_PATH` generuje losową, 1-blokową połączoną bezpieczną ścieżkę w obszarze bloków od `start` do `end`:
#    - min-x, min-y, min-z / max-x, max-y, max-z: Obszar prostopadłościanu podłogi labiryntu.
#    - start-x, start-y, start-z / end-x, end-y, end-z: Punkty startowe i końcowe ścieżki.
#    - safe-block-material: Materiał bezpiecznej ścieżki (np. CRACKED_DEEPSLATE_BRICKS).
#    - crumble-block-material: Materiał fałszywych bloków (np. CRACKED_DEEPSLATE_BRICKS).
#    - Kary za błędny krok: Stanięcie na blok poza ścieżką rozpada go (TempBlock AIR z efektami) i siłą ciągnie gracza w dół aż dotknie pierwszego bloku podłoża.
#    - Efekty strefowe: W kolumnie nad całą strefą podłogi gracze otrzymują ciągły efekt Slowness oraz blokadę magii (Chi-Block).
#      Jeśli gracz zboczy w osi X/Z o więcej niż 1 blok poza krawędzie bezpiecznej ścieżki, zostaje gwałtownie ściągnięty w dół!
#    - reveal-x, reveal-y, reveal-z, reveal-radius: Stanięcie w strefie reveal podświetla bezpieczną ścieżkę partiklami (END_ROD/GLOW) TYLKO GRACZOWI stojącemu w strefie.
#    - reshuffle-interval-seconds: Opcjonalna zmiana ścieżki co X sekund (zachowuje pozycje graczy na ich obecnych blokach).
#    Przykład YAML:
#      conditions:
#        - type: DYNAMIC_PATH
#          min-x: 91
#          min-y: 48
#          min-z: -17
#          max-x: 83
#          max-y: 48
#          max-z: -33
#          start-x: 91
#          start-y: 48
#          start-z: -17
#          end-x: 83
#          end-y: 48
#          end-z: -33
#          reveal-x: 89
#          reveal-y: 51
#          reveal-z: -13
#          reveal-radius: 2
#          safe-block-material: CRACKED_DEEPSLATE_BRICKS
#          crumble-block-material: CRACKED_DEEPSLATE_BRICKS
#          reshuffle-interval-seconds: 10

# =========================================================================
# CZĘŚĆ XII: WARUNEK/MECHANIKA REBUILD (STOPNIOWA ODBUDOWA POLA)
# =========================================================================
# Mechanika `REBUILD` pozwala na dynamiczne odtworzenie wyznaczonego pola bloków w miarę
# postępów gracza w pozostałych warunkach etapu (np. ZONE, KILL_MOBS, INTERACT_BLOCK_WITH_ITEM, HIT_TARGETS itp.).
#
# Zasada działania:
# - Na starcie encounteru zdefiniowany obszar (`start` do `end` lub `min` do `max`) zostaje wyczyszczony do AIR (jeśli clear-field: true).
# - W miarę wykonywania celów (np. ładowanie strefy ZONE lub zabijanie kolejnych mobów), bloki pola są stopniowo
#   i płynnie odbudowywane w kolejności od punktu `start` do `end` z efektami cząsteczek stawiania bloków i dźwiękami!
# - Jeżeli gracz opuści strefę ZONE (lub postęp spadnie), odbudowane bloki płynnie znikają z dźwiękiem kruszenia.
# - Gdy warunek zostanie naładowany w 100%, całe pole jest w pełni ukończone i trwale zmaterializowane.
# - Może współpracować z DOWOLNYMI warunkami (nawet kilkoma naraz, obliczając uśredniony postęp).
#
# Parametry konfiguracji REBUILD:
# - type: REBUILD
# - start-x, start-y, start-z: Początek linii / punkt startowy odbudowy (blok #1).
# - end-x, end-y, end-z: Koniec linii / punkt końcowy odbudowy (ostatni blok).
# - min-x, min-y, min-z / max-x, max-y, max-z: (Alternatywnie/Opcjonalnie) Bounding box obszaru.
# - material: Materiał z jakiego ma powstać pole (np. STONE_BRICKS, OBSIDIAN, OAK_PLANKS).
#   Jeśli parametr 'material' nie zostanie podany, plugin zachowa i odtworzy oryginalne bloki ze schematu!
# - clear-field: true (Domyślnie true - usuwa bloki na start etapu, aby gracz musiał je odbudować).
#
# Przykłady użycia REBUILD:
#
# Przykład A: Odbudowa mostu podczas stania w strefie rytuału (ZONE)
# ENC_MOST_RYTUAL:
#   title: "&eUtrzymaj pozycję w kręgu, aby odbudować most!"
#   conditions:
#     - type: ZONE
#       x: 100.5
#       y: 64.0
#       z: -50.5
#       radius: 3.5
#       time: 25
#     - type: REBUILD
#       start-x: 105
#       start-y: 63
#       start-z: -50
#       end-x: 125
#       end-y: 63
#       end-z: -50
#       material: CRACKED_DEEPSLATE_BRICKS
#
# Przykład B: Odbudowa portalu wraz z zabijaniem mobów (KILL_MOBS)
# ENC_PORTAL_KILLS:
#   title: "&cPokonaj 6 strażników, aby zrekonstruować wrota!"
#   conditions:
#     - type: KILL_MOBS
#       mob-name: "Straznik"
#       amount: 6
#     - type: REBUILD
#       start-x: 50
#       start-y: 60
#       start-z: 10
#       end-x: 50
#       end-y: 68
#       end-z: 14
#       material: OBSIDIAN

# =========================================================================
# CZĘŚĆ XIII: WARUNEK/MECHANIKA HIT_TARGETS (ZBIJANIE LATAJĄCYCH CELÓW)
# =========================================================================
# Mechanika `HIT_TARGETS` generuje dynamiczne, poruszające się cele w powietrzu lub na mapie,
# którym gracze muszą zadać określoną ilość obrażeń (HP), aby je zniszczyć i zaliczyć etap.
#
# Zasada działania:
# - W każdym zadeklarowanym punkcie pojawia się świecący cel z hologramowym paskiem HP.
# - Cel porusza się w losowych trajektoriach w zdefiniowanym zasięgu `offset` z ustaloną prędkością `speed`.
# - Gracze mogą zadawać celom obrażenia:
#   * Atakiem wręcz (miecz, broń),
#   * Strzałem z łuku/kuszy/trójzębu,
#   * Rzucanymi pociskami lochowymi (np. cien_kamien / throwables),
#   * Magią żywiołów (ProjectKorra / umiejętności AmonPack).
# - Po każdym trafieniu cel odtwarza dźwięk trafienia, wskaźniki obrażeń oraz aktualizuje pasek zdrowia.
# - Po spadku HP do 0 cel widowiskowo eksploduje cząsteczkami, a na actionbarze pojawia się informacja o postępie.
# - Etap zostaje ukończony po zniszczeniu wszystkich zadeklarowanych celów.
#
# Parametry konfiguracji HIT_TARGETS:
# - type: HIT_TARGETS
# - hp: 25.0              # Ilość punktów życia każdego celu (domyślnie 20.0).
# - speed: 0.12           # Prędkość poruszania się celu (bloki na tick, domyślnie 0.12).
# - offset: 3.5           # Maksymalny promień losowego ruchu celu od punktu początkowego.
# - offset-x, offset-y, offset-z: (Opcjonalnie) Indywidualny zasięg ruchu w konkretnych osiach.
# - target-type: "ORB"    # Typ wizualny / kształt (ORB, SLIME, MAGMA_CUBE, ARMOR_STAND).
# - particle: "SOUL_FIRE_FLAME" # Typ cząsteczek otaczających cel (opcjonalny).
# - points:               # Lista koordynatów punktów startowych (każdy punkt = jeden cel).
#     - "85.5, 65.0, -30.5"
#     - "92.5, 66.5, -28.0"
#     - "80.0, 64.0, -35.0"
# - targets:              # (Alternatywnie) Lista celów z indywidualnym HP i prędkością:
#     - x: 85.5
#       y: 65.0
#       z: -30.5
#       hp: 40.0
#       speed: 0.18
#       offset: 4.0
#     - x: 92.5
#       y: 66.5
#       z: -28.0
#       hp: 20.0
#       speed: 0.10
#       offset: 2.5
#
# Przykład YAML dla HIT_TARGETS:
# ENC_STRZELNICA_CELI:
#   title: "&6Zestrzel wszystkie 3 latające kule energii!"
#   conditions:
#     - type: HIT_TARGETS
#       hp: 30.0
#       speed: 0.14
#       offset-x: 4.0
#       offset-y: 2.0
#       offset-z: 4.0
#       points:
#         - "120.5, 70.0, -45.5"
#         - "128.0, 72.0, -40.0"
#         - "115.0, 69.5, -48.0"
#       oncomplete:
#         - type: SEND_MESSAGE
#           message: "&a[Dungeon] &2Wszystkie rdzenie energii zostały zniszczone!"
#         - type: OPEN_DOOR
#           x1: 130
#           y1: 68
#           z1: -45
#           x2: 130
#           y2: 72
#           z2: -43
#
