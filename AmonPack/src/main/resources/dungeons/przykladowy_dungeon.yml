items:
  ksiega:
    material: "BOOK"
    nazwa: "&6Księga Wiedzy"
    opis:
      - "&7Wiedza, która otworzy Ci drogę."
    typ: "throwable"

loot-chest:
  allowed-stats:
    - HP
    # - DEF
    - DMG
    - SPEED
    - P_CRIT_RATE
    # - P_CRIT_DMG
    # - M_CRIT_RATE
    # - M_CRIT_DMG
    - REGEN
  allowed-blessings:
    # - VAMPIRISM
    # - DODGE
    # - ADRENALINE
    # - LIFESTEAL
    # - HEAL
    # - KNOCKBACK
