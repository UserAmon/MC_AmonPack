name: "Komnata Cieni"
schematic: "komnata_cieni.schem"
paste-location:
  x: 0
  y: 60
  z: 0
spawn-location:
  x: 0
  y: 61
  z: 0
exit-location:
  world: "world"
  x: 100
  y: 64
  z: 100
initial-encounter: "ENC1"

items:
  cien_klucz:
    material: "TRIPWIRE_HOOK"
    nazwa: "&6Klucz Cieni"
    opis:
      - "&7Klucz do otwarcia starożytnych wrót."
    typ: "key"
  cien_kamien:
    material: "FIRE_CHARGE"
    nazwa: "&cRzucany Kamień Płomieni"
    opis:
      - "&7Rzuć tym PPM w punkt lub w shielded bossa!"
    typ: "throwable"

loot-chest:
  allowed-stats:
    - HP
    # - DEF
    - DMG
    - SPEED
    - P_CRIT_RATE
    # - P_CRIT_DMG
    - M_CRIT_RATE
    # - M_CRIT_DMG
    - REGEN
  allowed-blessings:
    # - VAMPIRISM
    # - DODGE
    # - ADRENALINE
    # - LIFESTEAL
    # - HEAL
    # - KNOCKBACK
    # - COUNTER
    # - FLAMING
    # - POISON
    # - COMBUSTION
    - EARTH_MACE
    - WIND_SICKLE
    - WATER_STAFF
    - MAI_DAGGERS
    - AMON_GLOVE
    - POUHAI_BOW

rewards:
  dungeon-xp: 250
  money: 500
  commands:
    - "give %player% gold_ingot 5"
  items:
    item1:
      material: "GOLDEN_APPLE"
      amount: 1
      display-name: "&6Jablko Zwyciezcy"
      lore:
        - "&7Nagroda za ukonczenie dungeonu."

encounters:
  ENC1:
    description: "Start lochu - Przygotowanie"
    title: "&aKomnata Cieni &8- &fOczekiwanie na gotowość"
    conditions:
      - type: "ALL_PLAYERS_READY"
    effects:
      - type: "GIVE_READY_COMPASS"
      - type: "SEND_MESSAGE"
        message: "&a[Dungeon] &fRozpoczalem przygode! Przygotuj sie!"
      - type: "SPAWN_CHEST"
        x: 2
        y: 60
        z: 9
        chest-type: "ROGUELITE_CHEST"
      - type: "SPAWN_CHEST"
        x: 5
        y: 60
        z: 9
        chest-type: "ROGUELITE_CHEST"
      - type: "SPAWN_CHEST"
        x: -1
        y: 60
        z: 9
        chest-type: "ROGUELITE_CHEST"
    next: "random"
    pool:
      - "ENC2_1"
      - "ENC2_2"
      - "ENC2_3"
      - "ENC2_4"
    req_clears: 2
    enc_after_clears: "ENC_SEKWENCJA"

  ENC2_1:
    description: "Zadanie 1: Pokonanie Duchów Ziemi"
    title: "&cWyzwanie Ziemi &8- &fPokonano $ActNumber$/$ReqNumber$ Duchów"
    leave_mobs: false
    conditions:
      - type: "KILL_MOBS"
        mob-name: "Duch Ziemi"
        amount: 3
        oncomplete:
          - type: "SEND_MESSAGE"
            message: "&a[Dungeon] &fDuchy Ziemi zostały pokonane!"
    effects:
      - type: "SPAWN_MOB"
        mob-name: "Spirit_Earth_1"
        amount: 3
        level: 1
        x: 1
        y: 60
        z: 0
        range: 4

  ENC2_2:
    description: "Zadanie 2: Przejęcie strefy i przetrwanie"
    title: "&ePrzejęcie Strefy &8- &fPostęp: $ActNumber$/$ReqNumber$ sekund"
    max_mobs: 5
    conditions:
      - type: "ZONE"
        x: 0
        y: 60
        z: 0
        radius: 3.0
        time: 20
        oncomplete:
          - type: "SEND_MESSAGE"
            message: "&a[Dungeon] &fStrefa została pomyślnie przejęta!"
    effects:
      - type: "SPAWN_UNTIL"
        mob-name: "ShadowGhost"
        amount: 2
        level: 1
        x: 15
        y: 61
        z: 5
        range: 2
        interval: 7


  ENC2_3:
    description: "Zadanie 3: Pokonanie potworów i rzut w punkt"
    title: "&5Wyzwanie Zręczności &8- &fRzuty: $ActNumber$/$ReqNumber$"
    max_mobs: 3
    conditions:
      - type: "DROP_ON_DEATH"
        mob-name: "Duch Cienia"
        item: "cien_kamien"
        chance: 100.0
      - type: "THROW_AT"
        x: 16
        y: 70
        z: -2
        radius: 3
        item: "cien_kamien"
        amount: 4
        oncomplete:
          - type: "SEND_MESSAGE"
            message: "&a[Dungeon] &fPłomienie w kociołku zapłonęły!"
    effects:
      - type: "SPAWN_UNTIL"
        mob-name: "ShadowGhost"
        amount: 2
        level: 1
        x: 16
        y: 60
        z: -2
        range: 2
        interval: 10
      - type: "SEND_MESSAGE"
        message: "&a[Dungeon] &fPokonaj Duchy Cienia, aby zdobyć Ogniste Kamienie i rzuć nimi w punkt (15, 63, 0)!"


  ENC2_4:
    description: "Zadanie 4: Pokonanie osłoniętego Bossa"
    title: "&dOsłonięty Wróg &8- &fTrafienia: $ActNumber$/$ReqNumber$"
    max_mobs: 4
    conditions:
      - type: "DROP_ON_DEATH"
        mob-name: "Duch Ziemi"
        item: "cien_kamien"
        chance: 100.0
      - type: "THROW_AT_ENEMY"
        mob-name: "ShadowGhost"
        item: "cien_kamien"
        amount: 4
        x: -2
        y: 60
        z: -11
        oncomplete:
          - type: "SEND_MESSAGE"
            message: "&a[Dungeon] &fTarcza Bossa została zniszczona!"
    effects:
      - type: "SPAWN_UNTIL"
        mob-name: "Spirit_Earth_1"
        amount: 2
        level: 1
        x: -2
        y: 60
        z: -10
        range: 2
        interval: 10
      - type: "SEND_MESSAGE"
        message: "&a[Dungeon] &fUważaj! Pojawił się chroniony Boss. Pokonaj Duchy Ziemi, zbierz kamienie i zniszcz jego tarczę!"


  ENC_SEKWENCJA:
    description: "Wybór losowej sekwencji przed Bossem"
    title: "&3Losowa Ścieżka &8- &fPrzygotowanie"
    conditions:
      - type: "ALL_PLAYERS_READY"
    effects:
      - type: "SEND_MESSAGE"
        message: "&3[Dungeon] &fCzas wybrać twoje ostateczne próby. Kompas gotowości rozstrzygnie ścieżkę!"
      - type: "GIVE_READY_COMPASS"
      - type: "SPAWN_CHEST"
        x: 2
        y: 60
        z: 9
        chest-type: "ROGUELITE_CHEST"
      - type: "SPAWN_CHEST"
        x: 5
        y: 60
        z: 9
        chest-type: "ROGUELITE_CHEST"
    next: "random"
    pool_lists:
      - ["ENC_SEQ1_1", "ENC_SEQ1_2"]
      - ["ENC_SEQ2_1", "ENC_SEQ2_2"]
    enc_after_clears: "ENC_FINAL_CHALLENGE"

  ENC_SEQ1_1:
    description: "Ścieżka Wojownika: Oczyszczenie komnaty"
    title: "&cPróba Wojownika I &8- &fPokonaj $ActNumber$/$ReqNumber$ Szkieletów"
    conditions:
      - type: "KILL_MOBS"
        mob-name: "SKELETON"
        amount: 3
    effects:
      - type: "SPAWN_MOB"
        mob-name: "SKELETON"
        amount: 3
        level: 1
        x: 23
        y: 65
        z: 3
        range: 3

  ENC_SEQ1_2:
    description: "Ścieżka Wojownika: Finałowe starcie"
    title: "&cPróba Wojownika II &8- &fPokonaj $ActNumber$/$ReqNumber$ Zombie"
    max_mobs: 3
    conditions:
      - type: "DROP_ON_DEATH"
        mob-name: "Duch Ziemi"
        item: "cien_kamien"
        chance: 100.0
      - type: "THROW_AT"
        x: 16
        y: 70
        z: -2
        radius: 3
        item: "cien_kamien"
        amount: 7
        oncomplete:
          - type: "SEND_MESSAGE"
            message: "&a[Dungeon] &fPłomienie w kociołku zapłonęły!"
    effects:
      - type: "SPAWN_UNTIL"
        mob-name: "Spirit_Earth_1"
        amount: 2
        level: 1
        x: 22
        y: 6
        z: 4
        range: 2
        interval: 10
      - type: "SEND_MESSAGE"
        message: "&a[Dungeon] &fPokonaj Duchy Ziemi, aby zdobyć Ogniste Kamienie i rzuć nimi w medalion biblioteki!"


  ENC_SEQ2_1:
    description: "Ścieżka Łowcy: Szybkie przejęcie strefy"
    title: "&ePróba Łowcy I &8- &fUtrzymaj strefę: $ActNumber$/$ReqNumber$s"
    max_mobs: 5
    conditions:
      - type: "ZONE"
        x: 13
        y: 57
        z: -11
        radius: 3.0
        time: 25
    effects:
      - type: "SEND_MESSAGE"
        message: "&e[Dungeon] &fUtrzymaj tę małą strefę pod presją czasu!"
      - type: "SPAWN_UNTIL"
        mob-name: "ZOMBIE"
        amount: 3
        level: 1
        x: 13
        y: 57
        z: -11
        range: 2
        interval: 10


  ENC_SEQ2_2:
    description: "Ścieżka Łowcy: Polowanie na pająki"
    title: "&ePróba Łowcy II &8- &fZabij $ActNumber$/$ReqNumber$ Pająków"
    conditions:
      - type: "KILL_MOBS"
        mob-name: "SPIDER"
        amount: 4
    effects:
      - type: "SPAWN_MOB"
        mob-name: "SPIDER"
        amount: 4
        level: 1
        x: 23
        y: 57
        z: -11
        range: 1


  ENC_FINAL_CHALLENGE:
    description: "Komnata Strażnika Prawdy - Wyzwanie środowiskowe i boss"
    title: "&5Strażnik Prawdy &8- &fKary za: %time%s"
    max_mobs: 6
    conditions:
      - type: "PERIODIC_CHECK"
        interval: 15
        requirement: "SNEAKING"
        fail-effects:
          - type: "SEND_MESSAGE"
            message: "&cStrażnik Prawdy uderza w tych, którzy nie pochylają czoła!"
          - type: "DAMAGE"
            amount: 2
          - type: "KNOCKBACK"
            x: 0.2
            y: 0.65
            z: 0.2
        success-effects:
          - type: "SEND_MESSAGE"
            message: "&aUniknąłeś wzroku Strażnika!"
      - type: "LOOKING_AT"
        x: 16
        y: 70
        z: -2
        interval: 15
        radius: 5
        fail-effects:
          - type: "SPAWN_MOB"
            mob-name: "SKELETON"
            amount: 1
            level: 1
            x: 0
            y: 61
            z: 0
            range: 2
        success-effects:
          - type: "SEND_MESSAGE"
            message: "&dTwoje spojrzenie powstrzymało przyzwanie wrogów... Na razie!"
      - type: "KILL_MOBS"
        mob-name: "Starszy Straznik"
        amount: 1
    platforms:
      - x1: 17
        y1: 64
        z1: 4
        x2: 17
        y2: 60
        z2: -8
        material: "PURPLE_STAINED_GLASS"
        inverted: true
        test-mode: "GLOBAL"
        requirement: "SNEAKING"
      - x1: 4
        y1: 64
        z1: -9
        x2: 18
        y2: 60
        z2: -9
        material: "POLISHED_BLACKSTONE_BRICKS"
        inverted: false
        test-mode: "NEAR"
        requirement: "MOB_NEAR:Starszy Straznik"
        delay: 3
        check-interval: 5
    effects:
      - type: "SEND_MESSAGE"
        message: "&d[Dungeon] &fWszedłeś do Serca Cieni. Kucaj co 15 sekund, obserwuj kryształ wzrokiem i pokonaj bossa!"
      - type: "SPAWN_MOB"
        mob-name: "Skeleton_Guardian"
        amount: 1
        level: 3
        x: 15
        y: 65
        z: 6
        range: 0

    next: "ENC3"

  ENC3:
    description: "Wyjście i nagrody"
    title: "&6Ucieczka &8- &fZnajdź portal wyjściowy"
    conditions:
      - type: "PLAYER_ENTER_AREA"
        x: 0
        y: 61
        z: 9
        radius: 3.0
    effects:
      - type: "SPAWN_CHEST"
        x: 0
        y: 61
        z: 0
        chest-type: "ROGUELITE_CHEST"
      - type: "SEND_MESSAGE"
        message: "&a[Dungeon] &fPortal wyjściowy jest gotowy. Stań w nim, aby ukończyć loch!"
      - type: "COMPLETE_DUNGEON"
