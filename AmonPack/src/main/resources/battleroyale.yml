# Wydarzenia mapy (Atmosferyczne wyzwania losowane na start meczu)
events:
  enabled: true
  chance-silence: 0.35
  chance-dehydration: 0.35
  chance-none: 0.30

# Niestandardowi zombie
custom-zombies:
  leaper-speed: 0.34
  leaper-cooldown-seconds: 4
  gunner-shot-cooldown-seconds: 4.5

# ==============================================================================
#                  DYNAMICZNE WYDARZENIA W CZASIE MECZU
# ==============================================================================
dynamic-events:
  enabled: true
  minimum-game-time: 180
  cooldown: 120

air-drop:
  enabled: true
  chance: 0.25
  cooldown: 300

blackout:
  enabled: true
  chance: 0.20
  duration: 60
  cooldown: 180

blood-moon:
  enabled: true
  chance: 0.15
  duration: 60
  cooldown: 300

car-alarm:
  enabled: true
  chance: 0.30
  duration: 45
  cooldown: 180

# System plecaków przetrwania (I, II, III)
backpacks:
  tiers:
    1: { slots: 18, name: "&6&l🎒 Plecak Skautowy [Poziom I]" }
    2: { slots: 27, name: "&5&l🎒 Plecak Taktyczny [Poziom II]" }
    3: { slots: 36, name: "&b&l🎒 Plecak Przetrwania [Poziom III]" }
  zombie-drop-chances:
    stalker: 0.10
    bloater: 0.15
    survivor: 0.25
    boss: 1.00

# System kluczy i zamkniętych drzwi żelaznych
keys:
  consume-on-use: false
  locked-doors:
    - { key: "POLICE_STATION", world: "hungergames_arena", x: 12.0, y: 101.0, z: 18.0 }
    - { key: "PHARMACY", world: "hungergames_arena", x: -16.0, y: 101.0, z: 22.0 }
    - { key: "MILITARY_DEPOT", world: "hungergames_arena", x: 30.0, y: 101.0, z: -20.0 }
    - { key: "APARTMENT_204", world: "hungergames_arena", x: -25.0, y: 101.0, z: -30.0 }

extraction:
  # Promień portalu na środku mapy
  portal-radius: 2.5
  rewards:
    commands:
      - "give %player% diamond 5"
      - "give %player% golden_apple 2"
    exp: 500
