# Konfiguracja modyfikacji rusznikarskich (Gunsmith mods)
mods:
  rifling:
    spread_reduction: 0.30 # -40% rozrzutu
    range_bonus: 10.0 # +10m zasięgu
  reinforced_lock:
    reload_time_reduction: 0.30 # -30% czasu ładowania
  bayonet:
    melee_damage: 7.0
  recoil_stock:
    recoil_reduction: 0.40
  unique_mods:
    pistol_lightweight:
      remove_speed_penalty: true
    shotgun_double_barrel:
      max_ammo: 2
    musket_scope:
      zoom_level: 10.0
      headshot_bonus: 0.35
    pepperbox_extended_mag:
      max_ammo: 5
      recoil_reduction: 0.50
      smoke_reduction: 0.50
