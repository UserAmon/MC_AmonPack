      name: "§b§lSplash"
      element: WATER
      mana_cost: 15
      cooldown: 1.0
      damage: 4
      description: "Wodny pocisk Waterstrike (wymaga butelki wody w EQ lub wody w pobliżu)."

    freeze:
      name: "§3§lFreeze"
