# ==============================================================================
#                 AMONPACK - GŁÓWNA KONFIGURACJA MAGII
# ==============================================================================
# W tym pliku możesz konfigurować:
#  - Żywioły (czas trwania statusów)
#  - Wszystkie Zaklęcia (obrażenia, koszty many, cooldowny, opisy)
#  - Ulepszenia Zaklęć i Przedmiotów Magicznych (koszty EXP, opisy)
#  - Przedmioty Magiczne (poziomy odblokowań, wymagane zabójstwa, poziomy, przedmioty)
#
# Przeładuj konfigurację w grze komendą: /amon magic reload  lub  /amon reload
# ==============================================================================

magic:
  # ============================================================================
  #                                 ŻYWIOŁY
  # ============================================================================
  elements:
    FIRE:
      name: "§cOgień"
      icon: "🔥"
      status_duration: 6
    WATER:
      name: "§bWoda"
      icon: "💧"
      status_duration: 6
    AIR:
      name: "§fPowietrze"
      icon: "💨"
      status_duration: 6
    EARTH:
      name: "§aZiemia"
      icon: "🌱"
      status_duration: 6
    LIGHTNING:
      name: "§ePiorun"
      icon: "⚡"
      status_duration: 6

  # ============================================================================
  #                                ZAKLĘCIA
  # ============================================================================
  spells:
    # ---------------------------- OGIEŃ (FIRE) --------------------------------
    fireblast:
      name: "§c§lFire Blast"
      element: FIRE
      mana_cost: 10
      cooldown: 3.5
      damage: 4.0
      description: "Wystrzeliwuje ognistą kulę podpalającą i eksplodującą przy trafieniu."

    blazing:
      name: "§6§lBlazing"
      element: FIRE
      mana_cost: 30
      cooldown: 4.0
      damage: 6.0
      description: "Ciska 3 kulami ognia w rozrzucie."

    flashpoint:
      name: "§4§lFlashPoint"
      element: FIRE
      mana_cost: 40
      cooldown: 10.0
      damage: 10.0
      description: "Potężny promień skupionego ognia penetrujący linie wrogów."

    fire_circle:
      name: "§e§lFire Circle"
      element: FIRE
      mana_cost: 20
      cooldown: 12.0
      damage: 4.0
      description: "Tworzy pierścień ognia wokół rzucającego odpychający i palący wrogów."

    barrage:
      name: "§c§lBarrage"
      element: FIRE
      mana_cost: 25
      cooldown: 8.0
      damage: 3.5
      description: "Grad małych pocisków ognia spadający na cel."

    # ------------------------- POWIETRZE (AIR) -------------------------------
    blow:
      name: "§f§lBlow"
      element: AIR
      mana_cost: 5
      cooldown: 2
      damage: 2.0
      description: "Wystrzeliwuje silny podmuch wiatru odrzucający wrogów."

    airblade:
      name: "§b§lAirblade"
      element: AIR
      mana_cost: 35
      cooldown: 3.0
      damage: 8.0
      description: "Cięcie powietrzne przecinające wszystkich wrogów na drodze."

    air_vortex:
      name: "§3§lWir Powietrza"
      element: AIR
      mana_cost: 35
      cooldown: 8.0
      damage: 4.0
      description: "Tkanie gwiazdy wiatru i uwolnienie gigantycznego wiru."

    # ------------------------ BŁYSKAWICE (LIGHTNING) -------------------------
    lightning:
      name: "§e§lLightning"
      element: LIGHTNING
      mana_cost: 25
      cooldown: 8.0
      damage: 8.0
      description: "Odliczający pierścień elektryczny, w który po 2s uderza piorun."

    chain_lightning:
      name: "§6§lChain Lightning"
